<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --black:#05070b; --navy-950:#080d16; --navy-900:#0b1220; --navy-800:#101a2c;
    --panel:rgba(255,255,255,0.035); --border:rgba(255,255,255,0.09);
    --gold:#cbb98d; --gold-bright:#e6d9b0; --green:#3ddc84;
    --text:#f2f1ec; --text-dim:#93a0b4; --text-dimmer:#5c6779;
    --mono:'JetBrains Mono',monospace; --sans:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--black); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  .app{ display:flex; min-height:100vh; }
  .logo-chip{ display:inline-flex; align-items:center; line-height:0; }
  .logo-chip img{ display:block; height:34px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .logo-chip.sm img{ height:26px; }
  .logo-chip.lg img{ height:44px; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .brand-word{ font-weight:800; letter-spacing:0.16em; color:var(--gold-bright); font-size:15px; text-shadow:0 0 14px rgba(203,185,141,0.35); }
  .brand-word.sm{ font-size:12px; letter-spacing:0.13em; }
  .brand-word.lg{ font-size:17px; }
  .sidebar{
    width:230px; flex-shrink:0; background:var(--navy-950);
    border-right:1px solid var(--border); padding:26px 16px; display:flex; flex-direction:column;
  }
  .brand{ padding:0 10px 28px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  nav.primary-nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px;
    font-size:13.5px; font-weight:700; color:var(--text-dim); cursor:pointer; border:1px solid transparent;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:0.85; }
  .nav-item:hover{ background:var(--panel); color:var(--text); }
  .nav-item.active{ background:rgba(203,185,141,0.14); color:var(--gold-bright); border-color:rgba(203,185,141,0.28); }
  .nav-item.active svg{ opacity:1; }
  .sidebar-bottom{ margin-top:auto; padding-top:16px; }
  .logout-btn{
    font-size:11.5px; font-weight:700; color:var(--text-dim); background:none;
    border:1px solid var(--border); border-radius:999px; padding:8px 12px; cursor:pointer;
    font-family:var(--sans); width:100%;
  }
  .logout-btn:hover{ color:var(--text); border-color:var(--gold); }
  .mobile-header{ display:none; }
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:25; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  main.dash{
    flex:1; min-width:0; padding:26px 34px 60px;
    background:
      radial-gradient(1100px 480px at 82% -10%, rgba(203,185,141,0.10), transparent 60%),
      linear-gradient(180deg, var(--navy-900), var(--black) 55%);
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:34px; }
  .profile-block{ display:flex; align-items:center; gap:10px; }
  a.profile-block:hover .name{ color:var(--gold-bright); }
  .profile-text{ text-align:right; line-height:1.3; }
  .profile-text .label{ font-size:10px; letter-spacing:0.12em; color:var(--text-dimmer); font-family:var(--mono); font-weight:700; }
  .profile-text .name{ font-size:13.5px; font-weight:700; }
  .avatar-wrap{ position:relative; }
  .avatar{
    width:34px; height:34px; border-radius:50%; background:linear-gradient(145deg,#3a4a63,#1b2534);
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    color:var(--text); border:1px solid var(--border);
  }
  .status-dot{
    width:9px; height:9px; border-radius:50%; background:var(--green); position:absolute;
    right:-1px; bottom:-1px; border:2px solid var(--navy-900);
  }
  .page-head{ margin-bottom:22px; }
  h1.title{ font-size:clamp(22px,2.6vw,30px); font-weight:800; letter-spacing:0.01em; margin:0; }
  h1.title span{ color:var(--gold-bright); }
  .subtitle{ font-size:12.5px; color:var(--text-dim); font-family:var(--mono); margin-top:4px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; }

  /* ---------- polls ---------- */
  .poll-list{ display:flex; flex-direction:column; gap:16px; }
  .poll-card{ overflow:hidden; }
  .poll-image{
    height:160px; margin:-20px -20px 16px; border-radius:14px 14px 0 0; overflow:hidden;
    background:linear-gradient(200deg,#1a2233,#0a0e16 60%); display:flex; align-items:center; justify-content:center;
  }
  .poll-image img{ width:100%; height:100%; object-fit:cover; display:block; }
  .poll-image svg{ width:32px; height:32px; color:var(--gold); opacity:0.6; }
  .poll-title{ font-size:15px; font-weight:800; margin-bottom:4px; }
  .poll-desc{ font-size:12.5px; color:var(--text-dim); line-height:1.6; margin-bottom:16px; }
  .poll-closes{ font-family:var(--mono); font-size:10.5px; color:var(--text-dimmer); margin-bottom:14px; }

  .option-btn{
    display:block; width:100%; text-align:left; padding:12px 14px; border-radius:10px;
    border:1px solid var(--border); background:rgba(255,255,255,0.02); color:var(--text);
    font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:8px;
  }
  .option-btn:hover{ border-color:var(--gold); background:rgba(203,185,141,0.06); }
  .option-btn:disabled{ cursor:default; }

  .result-row{ margin-bottom:12px; }
  .result-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
  .result-top .option-label{ font-weight:700; }
  .result-top .option-label.picked{ color:var(--gold-bright); }
  .result-top .option-pct{ font-family:var(--mono); color:var(--text-dim); }
  .result-bar-track{ height:8px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .result-bar-fill{ height:100%; background:var(--gold-bright); border-radius:999px; transition:width .3s ease; }
  .result-bar-fill.picked{ background:var(--green); }
  .voted-note{ font-family:var(--mono); font-size:10.5px; color:var(--green); margin-top:10px; }
  .poll-msg{ font-size:11.5px; font-family:var(--mono); margin-top:10px; }
  .poll-msg.error{ color:#e88a8a; }

  .empty-state{
    text-align:center; padding:60px 20px; display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .empty-state svg{ width:40px; height:40px; color:var(--text-dimmer); }
  .empty-state h3{ font-size:15px; font-weight:700; margin:0; }
  .empty-state p{ font-size:12.5px; color:var(--text-dim); margin:0; max-width:340px; }

  @media (max-width:980px){
    .sidebar{ display:none; }
    .mobile-header{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,var(--navy-900),var(--black));
      position:sticky; top:0; z-index:20;
    }
    .mobile-header .left{ display:flex; align-items:center; gap:12px; }
    .menu-btn{
      background:none; border:1px solid var(--border); border-radius:8px; width:32px; height:32px;
      display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0;
    }
    .menu-btn svg{ width:16px; height:16px; }
    .sidebar.mobile-open{
      display:flex; position:fixed; top:0; left:0; height:100%; z-index:30;
      transform:translateX(0); box-shadow:20px 0 40px rgba(0,0,0,0.5);
    }
    main.dash{ padding:18px 16px 44px; }
    .topbar{ display:none; }
    h1.title{ font-size:19px; }
  }
</style>
</head>
<body>

<div id="loading" style="color:var(--text-dim); font-size:14px; padding:60px 34px;">Loading your account…</div>

<div id="content" style="display:none;">

  <div class="scrim" id="scrim"></div>

  <header class="mobile-header">
    <div class="left">
      <button class="menu-btn" id="menu-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brandmark">
        <div class="logo-chip sm"><img src="valence-mark.png" alt="VALENCE"></div>
        <span class="brand-word sm">VALENCE</span>
      </div>
    </div>
    <a class="profile-block" href="profile.html">
      <div class="profile-text">
        <div class="label">PROFILE</div>
        <div class="name" id="dash-username-m">—</div>
      </div>
      <div class="avatar-wrap">
        <div class="avatar" id="avatar-initial-m">—</div>
        <div class="status-dot"></div>
      </div>
    </a>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brandmark">
          <div class="logo-chip lg"><img src="valence-logo.png" alt="VALENCE"></div>
          <span class="brand-word lg">VALENCE</span>
        </div>
      </div>
      <nav class="primary-nav">
        <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>
        <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>My Profile</a>
        <a href="collection.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="1.5"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>My Collection</a>
        <a href="preorder.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l6.5 9.5M16 7l-6.5 9.5"/></svg>Pre-Order</a>
        <a href="market.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3z"/></svg>Explore Market</a>
        <a href="orders.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-1.5 12.5a2 2 0 01-2 1.5H7.5a2 2 0 01-2-1.5L4 5z"/><path d="M4 5l-1-2"/></svg>Orders</a>
        <a href="voting.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11v9M7 11L3 9.5V20l4 1M7 11l6-4 4 2.5M17 9.5V20l4-1V10l-4-2M11 7v10"/></svg>Voting</a>
        <a href="support.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.7-2.5 1.7-2.5 3.5"/><path d="M12 17h.01"/></svg>Support</a>
        <a href="settings.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <button class="logout-btn" id="logout-btn">Log Out</button>
      </div>
    </aside>

    <main class="dash">
      <div class="topbar">
        <div class="brandmark">
          <div class="logo-chip"><img src="valence-logo.png" alt="VALENCE"></div>
          <span class="brand-word">VALENCE</span>
        </div>
        <a class="profile-block" href="profile.html">
          <div class="profile-text">
            <div class="label">PROFILE</div>
            <div class="name" id="dash-username">—</div>
          </div>
          <div class="avatar-wrap">
            <div class="avatar" id="avatar-initial">—</div>
            <div class="status-dot"></div>
          </div>
        </a>
      </div>

      <div class="page-head">
        <h1 class="title">COMMUNITY <span>VOTING</span></h1>
        <div class="subtitle" id="poll-count">Loading polls…</div>
      </div>

      <div class="poll-list" id="poll-list"></div>
    </main>
  </div>
</div>

<script>
  const boxIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="1.5"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>`;
  const emptyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11v9M7 11L3 9.5V20l4 1M7 11l6-4 4 2.5M17 9.5V20l4-1V10l-4-2M11 7v10"/></svg>`;

  let currentUserId = null;

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatDate(d){
    if (!d) return '—';
    return new Date(d).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  }

  function pollCardHTML(poll){
    const image = poll.image_url
      ? `<img src="${escapeHtml(poll.image_url)}" alt="${escapeHtml(poll.title)}">`
      : boxIcon;

    return `
      <div class="card poll-card" data-poll-id="${poll.id}">
        <div class="poll-image">${image}</div>
        <div class="poll-title">${escapeHtml(poll.title)}</div>
        ${poll.description ? `<div class="poll-desc">${escapeHtml(poll.description)}</div>` : ''}
        ${poll.closes_at ? `<div class="poll-closes">CLOSES ${formatDate(poll.closes_at)}</div>` : ''}
        <div class="poll-body"></div>
        <div class="poll-msg"></div>
      </div>`;
  }

  function optionsVotedHTML(poll, myOptionId, counts){
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    return poll.options.map(opt => {
      const count = counts[opt.id] || 0;
      const pct = total ? Math.round((count / total) * 100) : 0;
      const picked = opt.id === myOptionId;
      return `
        <div class="result-row">
          <div class="result-top">
            <span class="option-label ${picked ? 'picked' : ''}">${escapeHtml(opt.label)}${picked ? ' ✓' : ''}</span>
            <span class="option-pct">${pct}% · ${count}</span>
          </div>
          <div class="result-bar-track"><div class="result-bar-fill ${picked ? 'picked' : ''}" style="width:${pct}%"></div></div>
        </div>`;
    }).join('') + `<div class="voted-note">You voted on this poll.</div>`;
  }

  function optionsUnvotedHTML(poll){
    return poll.options.map(opt => `
      <button class="option-btn" data-option-id="${opt.id}">${escapeHtml(opt.label)}</button>
    `).join('');
  }

  async function loadResultsAndRender(pollEl, poll, myOptionId){
    const bodyEl = pollEl.querySelector('.poll-body');
    const { data, error } = await supabaseClient
      .from('poll_option_counts')
      .select('option_id, vote_count')
      .eq('poll_id', poll.id);

    const counts = {};
    (data || []).forEach(row => { counts[row.option_id] = row.vote_count; });

    bodyEl.innerHTML = optionsVotedHTML(poll, myOptionId, counts);
  }

  function wireVoteButtons(pollEl, poll){
    pollEl.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const msgEl = pollEl.querySelector('.poll-msg');
        msgEl.textContent = '';
        msgEl.className = 'poll-msg';
        pollEl.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

        const { error } = await supabaseClient
          .from('poll_votes')
          .insert([{ poll_id: poll.id, user_id: currentUserId, option_id: btn.dataset.optionId }]);

        if (error) {
          console.error('Vote failed:', error);
          pollEl.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
          msgEl.textContent = error.code === '23505'
            ? 'You already voted on this poll.'
            : 'Could not submit your vote. Please try again.';
          msgEl.classList.add('error');
          return;
        }

        await loadResultsAndRender(pollEl, poll, btn.dataset.optionId);
      });
    });
  }

  function emptyStateHTML(){
    return `
      <div class="card empty-state">
        ${emptyIcon}
        <h3>No open polls</h3>
        <p>New community votes on designs and drops will show up here.</p>
      </div>`;
  }

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = 'login.html?redirect=' + encodeURIComponent('voting.html');
      return;
    }

    const user = session.user;
    currentUserId = user.id;
    const meta = user.user_metadata || {};
    const displayName = meta.username || (user.email ? user.email.split('@')[0] : 'Member');

    document.getElementById('dash-username').textContent = displayName;
    document.getElementById('dash-username-m').textContent = displayName;

    const avatarEls = [document.getElementById('avatar-initial'), document.getElementById('avatar-initial-m')];
    if (meta.avatar_url) {
      avatarEls.forEach(el => { el.style.backgroundImage = `url("${meta.avatar_url}")`; el.textContent = ''; });
    } else {
      const initial = displayName.charAt(0).toUpperCase();
      avatarEls.forEach(el => { el.textContent = initial; });
    }

    const countEl = document.getElementById('poll-count');
    const listEl = document.getElementById('poll-list');

    try {
      const { data: polls, error: pollsError } = await supabaseClient
        .from('voting_polls')
        .select('id, title, description, image_url, options, closes_at')
        .eq('active', true)
        .order('created_at', { ascending: false });

      if (pollsError) throw pollsError;

      const { data: myVotes, error: votesError } = await supabaseClient
        .from('poll_votes')
        .select('poll_id, option_id')
        .eq('user_id', user.id);

      if (votesError) throw votesError;

      const myVoteMap = {};
      (myVotes || []).forEach(v => { myVoteMap[v.poll_id] = v.option_id; });

      countEl.textContent = `${(polls || []).length} open poll${(polls || []).length === 1 ? '' : 's'}`;
      listEl.innerHTML = (polls && polls.length) ? polls.map(pollCardHTML).join('') : emptyStateHTML();

      for (const poll of (polls || [])) {
        const pollEl = listEl.querySelector(`[data-poll-id="${poll.id}"]`);
        const bodyEl = pollEl.querySelector('.poll-body');
        const myOptionId = myVoteMap[poll.id];

        if (myOptionId) {
          await loadResultsAndRender(pollEl, poll, myOptionId);
        } else {
          bodyEl.innerHTML = optionsUnvotedHTML(poll);
          wireVoteButtons(pollEl, poll);
        }
      }
    } catch (err) {
      console.error('Failed to load polls:', err);
      countEl.textContent = 'Unable to load polls';
      listEl.innerHTML = emptyStateHTML();
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  })();

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) {
      window.location.href = 'login.html';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const menuBtn = document.getElementById('menu-btn');
  function toggleMenu(open){
    sidebar.classList.toggle('mobile-open', open);
    scrim.classList.toggle('open', open);
  }
  menuBtn.addEventListener('click', () => toggleMenu(true));
  scrim.addEventListener('click', () => toggleMenu(false));
</script>
</body>
</html>
