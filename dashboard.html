<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  body{ font-family:'Inter','Segoe UI',system-ui,sans-serif; margin:0; }
  header{
    background:linear-gradient(180deg, var(--blue-950), #0d1c33);
    border-bottom:1px solid #24365a;
    padding:18px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  .logo{ color:#fff; font-weight:800; letter-spacing:0.05em; font-size:14px; }
  .logout-btn{
    font-size:12.5px; font-weight:600; color:#cbb98d; background:none;
    border:1px solid rgba(203,185,141,0.5); border-radius:999px; padding:6px 14px; cursor:pointer;
  }
  .logout-btn:hover{ color:#fff; border-color:#fff; }
  main{ max-width:640px; margin:0 auto; padding:56px 24px 64px; }
  main h1{
    font-size:clamp(26px,4vw,34px); font-weight:800; color:var(--blue-950);
    letter-spacing:-0.02em; margin-bottom:8px;
  }
  main p{ color:#4a5568; font-size:14.5px; line-height:1.6; }
  .card{
    margin-top:28px; padding:20px; border:1px solid #e5e7eb; border-radius:12px;
    background:var(--blue-100, #f4f6fa);
  }
  .card dl{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:13.5px; }
  .card dt{ color:#94a3b8; font-weight:600; }
  .card dd{ margin:0; color:var(--blue-950); font-weight:600; }
  .loading{ color:#94a3b8; font-size:14px; }
</style>
</head>
<body>
<header>
  <span class="logo">VALENCE</span>
  <button class="logout-btn" id="logout-btn">Log Out</button>
</header>
<main>
  <div id="loading" class="loading">Loading your account…</div>
  <div id="content" style="display:none;">
    <h1>Welcome back<span id="welcome-name"></span></h1>
    <p>This is your VALENCE dashboard.</p>
    <div class="card">
      <dl>
        <dt>Username</dt><dd id="dash-username">—</dd>
        <dt>Email</dt><dd id="dash-email">—</dd>
        <dt>Phone</dt><dd id="dash-phone">—</dd>
      </dl>
    </div>
  </div>
</main>

<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      // No active session (never logged in, or logged out) — send them home.
      window.location.href = 'index.html';
      return;
    }

    const user = session.user;
    const meta = user.user_metadata || {};

    document.getElementById('welcome-name').textContent = meta.username ? ', ' + meta.username : '';
    document.getElementById('dash-username').textContent = meta.username || '—';
    document.getElementById('dash-email').textContent = user.email || '—';
    document.getElementById('dash-phone').textContent = meta.phone || user.phone || '—';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  })();

  // Stay in sync if the session ends in another tab.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) {
      window.location.href = 'index.html';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
