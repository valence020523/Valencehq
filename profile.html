<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --black:#050505; --near-black:#0a0a0a; --panel:#121212; --panel-2:rgba(255,255,255,0.03);
    --border:rgba(255,255,255,0.09); --border-soft:rgba(255,255,255,0.06);
    --gold:#cbb98d; --gold-bright:#e6d5a3; --gold-dim:rgba(203,185,141,0.14);
    --red:#e2694f; --green:#3ddc84;
    --text:#f2f1ec; --text-dim:#9a9fa8; --text-dimmer:#666b74;
    --serif:'Playfair Display', Georgia, serif; --sans:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--black); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:var(--sans); }

  /* ---------- page ---------- */
  main.page{ padding:44px 44px 80px; max-width:1320px; margin:0 auto; }
  h1.title{ font-family:var(--serif); font-weight:600; font-size:34px; margin:0 0 8px; }
  .subtitle{ color:var(--text-dim); font-size:14.5px; margin:0 0 34px; }

  .layout{ display:grid; grid-template-columns:260px 1fr; gap:26px; align-items:start; }

  /* ---------- side menu ---------- */
  .side-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:10px; }
  .side-item{
    display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:9px;
    font-size:14px; font-weight:600; color:var(--text-dim); border-left:2px solid transparent;
  }
  .side-item svg{ width:17px; height:17px; flex-shrink:0; opacity:0.85; }
  .side-item:hover{ background:var(--panel-2); color:var(--text); }
  .side-item.active{
    background:linear-gradient(90deg, rgba(203,185,141,0.16), rgba(203,185,141,0.04));
    color:var(--gold-bright); border-left:2px solid var(--gold);
  }
  .side-item.active svg{ opacity:1; }
  .side-bottom{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft); }
  .logout-btn{
    font-size:11.5px; font-weight:700; color:var(--text-dim); background:none;
    border:1px solid var(--border); border-radius:999px; padding:10px 12px; cursor:pointer;
    font-family:var(--sans); width:100%;
  }
  .logout-btn:hover{ color:var(--text); border-color:var(--gold); }

  /* ---------- profile card ---------- */
  .profile-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:34px 38px; }

  .profile-head{ display:flex; gap:26px; align-items:center; padding-bottom:26px; border-bottom:1px solid var(--border-soft); }
  .avatar-large-wrap{ position:relative; flex-shrink:0; }
  .avatar-large{
    width:132px; height:132px; border-radius:50%; border:2px solid var(--gold);
    padding:3px;
  }
  .avatar-large .img{
    width:100%; height:100%; border-radius:50%; background:linear-gradient(145deg,#3a4a63,#1b2534) center/cover;
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; color:var(--text);
  }
  .avatar-edit-btn{
    position:absolute; right:2px; bottom:2px; width:32px; height:32px; border-radius:50%;
    background:#1c1d20; border:1px solid var(--border); display:flex; align-items:center;
    justify-content:center; cursor:pointer; color:var(--text);
  }
  .avatar-edit-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .avatar-edit-btn svg{ width:14px; height:14px; }

  .profile-id .name{ font-family:var(--serif); font-size:28px; font-weight:600; margin:0 0 6px; }
  .profile-id .member-since{ color:var(--text-dim); font-size:13.5px; margin:0; }

  .contact-rows{ padding:20px 0 24px; border-bottom:1px solid var(--border-soft); display:flex; flex-direction:column; gap:14px; }
  .contact-row{ display:flex; align-items:center; gap:12px; font-size:14.5px; font-weight:600; }
  .contact-row svg{ width:17px; height:17px; color:var(--text-dim); flex-shrink:0; }

  .section-label{ font-size:15px; font-weight:700; margin:26px 0 6px; }

  .info-list{ display:flex; flex-direction:column; }
  .info-row{
    display:flex; align-items:center; justify-content:space-between; padding:16px 4px;
    border-bottom:1px solid var(--border-soft);
  }
  .info-row:last-child{ border-bottom:none; }
  .info-label{ color:var(--text-dim); font-size:13.5px; font-weight:600; width:150px; flex-shrink:0; }
  .info-value{ font-size:14.5px; font-weight:600; flex:1; text-align:right; }

  .save-msg{ text-align:center; font-size:12.5px; color:var(--green); margin-top:18px; height:14px; }
  .avatar-file-input{ display:none; }

  /* ---------- mobile hamburger + slide-out sidebar ---------- */
  .mobile-header{ display:none; }
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:25; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }

  @media (max-width:900px){
    .mobile-header{
      display:flex; align-items:center; gap:12px; padding:14px 18px;
      border-bottom:1px solid var(--border-soft); position:sticky; top:0;
      background:var(--black); z-index:20;
    }
    .menu-btn{
      background:none; border:1px solid var(--border); border-radius:8px; width:34px; height:34px;
      display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0;
    }
    .menu-btn:hover{ border-color:var(--gold); color:var(--gold-bright); }
    .menu-btn svg{ width:16px; height:16px; }
    .mobile-header-title{
      font-family:var(--serif); font-size:15px; letter-spacing:0.1em; font-weight:600; color:var(--gold-bright);
    }

    .side-card{ display:none; }
    .side-card.mobile-open{
      display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100%; width:78%;
      max-width:290px; z-index:30; border-radius:0; border-right:1px solid var(--border); border-top:none;
      border-bottom:none; border-left:none; overflow-y:auto; padding:18px 12px;
      box-shadow:20px 0 44px rgba(0,0,0,0.55);
    }
  }

  @media (max-width:900px){
    main.page{ padding:26px 18px 60px; }
    .layout{ grid-template-columns:1fr; }
    .profile-card{ padding:22px; }
    .profile-head{ flex-direction:column; text-align:center; }
    .info-row{ flex-wrap:wrap; gap:4px; }
  }
</style>
</head>
<body>

<div id="loading" style="color:var(--text-dim); font-size:14px; padding:60px 44px;">Loading your profile…</div>

<div id="content" style="display:none;">

  <div class="scrim" id="scrim"></div>

  <header class="mobile-header">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="mobile-header-title">VALENCE</span>
  </header>

  <main class="page">
    <h1 class="title">My Profile</h1>
    <p class="subtitle">Manage your account and preferences.</p>

    <div class="layout">
      <aside class="side-card" id="side-card">
        <a href="dashboard.html" class="side-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>
        <a href="profile.html" class="side-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>My Profile</a>
        <a href="collection.html" class="side-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="1.5"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>My Collection</a>
        <a href="orders.html" class="side-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-1.5 12.5a2 2 0 01-2 1.5H7.5a2 2 0 01-2-1.5L4 5z"/><path d="M4 5l-1-2"/></svg>Orders</a>
        <a href="voting.html" class="side-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11v9M7 11L3 9.5V20l4 1M7 11l6-4 4 2.5M17 9.5V20l4-1V10l-4-2M11 7v10"/></svg>Voting</a>
        <a href="support.html" class="side-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.7-2.5 1.7-2.5 3.5"/><path d="M12 17h.01"/></svg>Support</a>
        <a href="settings.html" class="side-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</a>
        <div class="side-bottom">
          <button class="logout-btn" id="side-logout">Log Out</button>
        </div>
      </aside>

      <section class="profile-card">
        <div class="profile-head">
          <div class="avatar-large-wrap">
            <div class="avatar-large">
              <div class="img" id="avatar-large-img">—</div>
            </div>
            <button class="avatar-edit-btn" id="avatar-edit-btn" aria-label="Change photo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            </button>
            <input type="file" accept="image/*" class="avatar-file-input" id="avatar-file-input">
          </div>
          <div class="profile-id">
            <p class="name" id="profile-name">—</p>
            <p class="member-since" id="member-since">Member since —</p>
          </div>
        </div>

        <div class="contact-rows">
          <div class="contact-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
            <span id="contact-email">—</span>
          </div>
          <div class="contact-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .6 3a2 2 0 01-.5 2.1L8 10a16 16 0 006 6l1.2-1.2a2 2 0 012.1-.5c1 .3 2 .5 3 .6a2 2 0 011.7 2z"/></svg>
            <span id="contact-phone">—</span>
          </div>
        </div>

        <h2 class="section-label">Personal Information</h2>
        <div class="info-list" id="info-list">
          <div class="info-row" data-field="full_name">
            <div class="info-label">Full Name</div>
            <div class="info-value" id="value-full_name">—</div>
          </div>
          <div class="info-row" data-field="email">
            <div class="info-label">Email Address</div>
            <div class="info-value" id="value-email">—</div>
          </div>
          <div class="info-row" data-field="phone">
            <div class="info-label">Phone Number</div>
            <div class="info-value" id="value-phone">—</div>
          </div>
          <div class="info-row" data-field="password">
            <div class="info-label">Password</div>
            <div class="info-value" id="value-password">••••••••••••</div>
          </div>
        </div>

        <div class="save-msg" id="save-msg"></div>
      </section>
    </div>
  </main>
</div>

<script>
  let currentUser = null;
  let currentMeta = {};

  function initials(name){
    return (name || '').trim().split(/\s+/).slice(0,2).map(w => w.charAt(0).toUpperCase()).join('') || 'U';
  }

  function formatMemberSince(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  }

  function applyAvatar(url, name){
    const els = [document.getElementById('avatar-large-img')];
    els.forEach(el => {
      if (url) {
        el.style.backgroundImage = `url("${url}")`;
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        el.textContent = '';
      } else {
        el.style.backgroundImage = 'none';
        el.textContent = initials(name);
      }
    });
  }

  function renderProfile(){
    const fullName = currentMeta.full_name || currentMeta.username || (currentUser.email ? currentUser.email.split('@')[0] : 'Member');
    const phone = currentMeta.phone || currentUser.phone || 'Not set';
    const email = currentUser.email || 'Not set';

    document.getElementById('profile-name').textContent = fullName;
    document.getElementById('member-since').textContent = `Member since ${formatMemberSince(currentUser.created_at)}`;
    document.getElementById('contact-email').textContent = email;
    document.getElementById('contact-phone').textContent = phone;

    document.getElementById('value-full_name').textContent = fullName;
    document.getElementById('value-email').textContent = email;
    document.getElementById('value-phone').textContent = phone;

    applyAvatar(currentMeta.avatar_url, fullName);
  }

  async function loadProfile(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentUser = session.user;
    currentMeta = currentUser.user_metadata || {};
    renderProfile();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  loadProfile();

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) {
      window.location.href = 'index.html';
    }
  });

  async function logout(e){
    e.preventDefault();
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }
  document.getElementById('side-logout').addEventListener('click', logout);

  // mobile hamburger sidebar toggle
  const sideCardEl = document.getElementById('side-card');
  const scrimEl = document.getElementById('scrim');
  const menuBtnEl = document.getElementById('menu-btn');
  function toggleMenu(open){
    sideCardEl.classList.toggle('mobile-open', open);
    scrimEl.classList.toggle('open', open);
  }
  menuBtnEl.addEventListener('click', () => toggleMenu(true));
  scrimEl.addEventListener('click', () => toggleMenu(false));

  // ---- avatar upload (expects a public "avatars" storage bucket) ----
  const saveMsg = document.getElementById('save-msg');

  document.getElementById('avatar-edit-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('avatar-file-input').click();
  });

  document.getElementById('avatar-file-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !currentUser) return;

    saveMsg.style.color = 'var(--text-dim)';
    saveMsg.textContent = 'Uploading photo…';

    const path = `${currentUser.id}/${Date.now()}-${file.name}`;
    const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(path, file, { upsert: true });
    if (uploadError) {
      saveMsg.style.color = 'var(--red)';
      saveMsg.textContent = `Upload failed: ${uploadError.message}`;
      return;
    }

    const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(path);
    const avatarUrl = publicUrlData.publicUrl;

    const { data, error } = await supabaseClient.auth.updateUser({ data: { avatar_url: avatarUrl } });
    if (error) {
      saveMsg.style.color = 'var(--red)';
      saveMsg.textContent = `Error: ${error.message}`;
      return;
    }

    currentUser = data.user;
    currentMeta = currentUser.user_metadata || {};
    renderProfile();
    saveMsg.style.color = 'var(--green)';
    saveMsg.textContent = 'Photo updated.';
  });
</script>
</body>
</html>
