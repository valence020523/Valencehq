<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In / Sign Up — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  body{ font-family:'Inter','Segoe UI',system-ui,sans-serif; margin:0; }
  header{
    background:linear-gradient(180deg, var(--blue-950), #0d1c33);
    border-bottom:1px solid #24365a;
    padding:18px 24px;
  }
  .back-link{
    font-size:12.5px; font-weight:600; color:#cbb98d;
    text-decoration:underline; text-underline-offset:3px; text-decoration-color:rgba(212,175,97,0.5);
  }
  .back-link:hover{ color:#fff; }
  main{ max-width:420px; margin:0 auto; padding:48px 24px 64px; }
  main h1{
    font-size:clamp(26px,4vw,36px); font-weight:800; color:var(--blue-950);
    letter-spacing:-0.02em; margin-bottom:6px;
  }
  main > p.sub{ color:#4a5568; font-size:14px; line-height:1.6; margin-bottom:28px; }

  .tabs{ display:flex; border-bottom:1px solid #e5e7eb; margin-bottom:24px; }
  .tab{
    flex:1; text-align:center; padding:10px 0; font-size:13.5px; font-weight:600;
    color:#94a3b8; cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab.active{ color:var(--blue-950); border-bottom-color:#d4af61; }

  form{ display:flex; flex-direction:column; gap:14px; }
  form.hidden{ display:none; }
  label{ font-size:12.5px; font-weight:600; color:#4a5568; }
  .hint{ font-size:11.5px; color:#94a3b8; font-weight:500; margin-top:3px; display:block; }
  input[type="email"], input[type="password"], input[type="text"], input[type="tel"]{
    width:100%; box-sizing:border-box; padding:10px 12px; margin-top:4px;
    border:1px solid #d9dee6; border-radius:8px; font-size:14px; font-family:inherit;
  }
  input[type="email"]:focus, input[type="password"]:focus, input[type="text"]:focus, input[type="tel"]:focus{ outline:none; border-color:#d4af61; }
  input.field-error{ border-color:#e14545; }
  .field-msg{ font-size:11.5px; color:#b42318; margin-top:4px; display:none; }
  .field-msg.show{ display:block; }
  .field-msg.ok{ color:#0a7a3c; }
  .submit-btn{
    margin-top:6px; padding:11px 0; border-radius:999px; border:none; cursor:pointer;
    font-size:14px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--blue-950),#1d3a63);
  }
  .submit-btn:disabled{ opacity:0.6; cursor:default; }
  .msg{ font-size:13px; margin-top:14px; padding:10px 12px; border-radius:8px; display:none; }
  .msg.show{ display:block; }
  .msg.error{ background:#fdecec; color:#b42318; }
  .msg.success{ background:#eafaf0; color:#0a7a3c; }

  footer{ padding:18px 24px 16px; text-align:center; }
  footer a{ color:#cbb98d; font-size:13px; text-decoration:underline; }
</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html">&larr; Back to VALENCE</a>
</header>
<main>
  <h1>Welcome</h1>
  <p class="sub">Log in to your VALENCE account, or sign up to track your drops and verified pieces.</p>

  <div class="tabs">
    <button type="button" class="tab active" data-tab="login">Log In</button>
    <button type="button" class="tab" data-tab="signup">Sign Up</button>
  </div>

  <form id="login-form">
    <div>
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required autocomplete="email">
    </div>
    <div>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
    </div>
    <button type="submit" class="submit-btn">Log In</button>
  </form>

  <form id="signup-form" class="hidden" novalidate>
    <div>
      <label for="signup-username">Username</label>
      <input type="text" id="signup-username" required autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+">
      <span class="hint">3–24 characters, letters/numbers/underscore only</span>
      <span class="field-msg" id="username-msg"></span>
    </div>
    <div>
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" required autocomplete="email">
      <span class="field-msg" id="email-msg"></span>
    </div>
    <div>
      <label for="signup-phone">Phone number</label>
      <input type="tel" id="signup-phone" required autocomplete="tel" placeholder="+1 555 123 4567">
      <span class="field-msg" id="phone-msg"></span>
    </div>
    <div>
      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" required autocomplete="new-password" minlength="6">
    </div>
    <div>
      <label for="signup-password-confirm">Confirm password</label>
      <input type="password" id="signup-password-confirm" required autocomplete="new-password" minlength="6">
      <span class="field-msg" id="confirm-msg"></span>
    </div>
    <button type="submit" class="submit-btn">Create Account</button>
  </form>

  <div id="msg" class="msg"></div>
</main>
<footer>
  <a href="index.html">Return home</a>
</footer>

<script>
  const tabs = document.querySelectorAll('.tab');
  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const msgEl = document.getElementById('msg');

  // If a session already exists, no need to be on this page at all.
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) window.location.href = 'dashboard.html';
  })();

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const isLogin = tab.dataset.tab === 'login';
      loginForm.classList.toggle('hidden', !isLogin);
      signupForm.classList.toggle('hidden', isLogin);
      hideMsg();
    });
  });

  function showMsg(text, type){
    msgEl.textContent = text;
    msgEl.className = 'msg show ' + type;
  }
  function hideMsg(){
    msgEl.className = 'msg';
  }
  function fieldMsg(id, text, ok){
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'field-msg' + (text ? ' show' : '') + (ok ? ' ok' : '');
  }

  function getRedirectTarget(){
    const params = new URLSearchParams(window.location.search);
    return params.get('redirect') || 'dashboard.html';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();
    const submitBtn = loginForm.querySelector('.submit-btn');
    submitBtn.disabled = true;
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    submitBtn.disabled = false;

    if (error) {
      showMsg(error.message, 'error');
      return;
    }
    showMsg('Logged in — redirecting…', 'success');
    window.location.href = getRedirectTarget();
  });

  // ---- Signup ----
  const usernameInput = document.getElementById('signup-username');
  const emailInput = document.getElementById('signup-email');
  const phoneInput = document.getElementById('signup-phone');
  const passwordInput = document.getElementById('signup-password');
  const confirmInput = document.getElementById('signup-password-confirm');

  function normalizePhone(v){
    return v.replace(/[^\d+]/g, '');
  }

  // Checks the `profile_lookup` view (safe, read-only) for an existing
  // row matching this username / email / phone so we can reject
  // duplicates before ever calling signUp().
  async function findConflict(username, email, phone){
    const { data, error } = await supabaseClient
      .from('profile_lookup')
      .select('username,email,phone')
      .or(`username.ilike.${username},email.ilike.${email},phone.eq.${phone}`)
      .limit(5);

    if (error) {
      // If the lookup itself fails (e.g. table not set up yet), don't block
      // signup on it — auth.signUp() still enforces email uniqueness.
      console.warn('Availability check failed:', error.message);
      return { conflicts: [], checkFailed: true };
    }

    const conflicts = [];
    (data || []).forEach(row => {
      if (row.username && row.username.toLowerCase() === username.toLowerCase()) conflicts.push('username');
      if (row.email && row.email.toLowerCase() === email.toLowerCase()) conflicts.push('email');
      if (row.phone && row.phone === phone) conflicts.push('phone');
    });
    return { conflicts, checkFailed: false };
  }

  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();
    ['username-msg','email-msg','phone-msg','confirm-msg'].forEach(id => fieldMsg(id, '', false));
    [usernameInput, emailInput, phoneInput].forEach(el => el.classList.remove('field-error'));

    const username = usernameInput.value.trim();
    const email = emailInput.value.trim();
    const phone = normalizePhone(phoneInput.value.trim());
    const password = passwordInput.value;
    const confirm = confirmInput.value;

    // Client-side validation
    if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
      fieldMsg('username-msg', 'Use 3–24 letters, numbers, or underscores.');
      usernameInput.classList.add('field-error');
      return;
    }
    if (phone.length < 8) {
      fieldMsg('phone-msg', 'Enter a valid phone number, including country code.');
      phoneInput.classList.add('field-error');
      return;
    }
    if (password !== confirm) {
      fieldMsg('confirm-msg', 'Passwords do not match.');
      return;
    }

    const submitBtn = signupForm.querySelector('.submit-btn');
    submitBtn.disabled = true;

    const { conflicts, checkFailed } = await findConflict(username, email, phone);

    if (conflicts.length) {
      if (conflicts.includes('username')) {
        fieldMsg('username-msg', 'That username is already taken.');
        usernameInput.classList.add('field-error');
      }
      if (conflicts.includes('email')) {
        fieldMsg('email-msg', 'An account with this email already exists.');
        emailInput.classList.add('field-error');
      }
      if (conflicts.includes('phone')) {
        fieldMsg('phone-msg', 'That phone number is already registered.');
        phoneInput.classList.add('field-error');
      }
      submitBtn.disabled = false;
      return;
    }

    const { error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: { data: { username, phone } }
    });

    submitBtn.disabled = false;

    if (error) {
      // Covers the case where the pre-check above failed silently
      // (checkFailed) and Supabase's own uniqueness check catches it.
      showMsg(error.message, 'error');
      return;
    }

    showMsg('Account created — check your email for a verification code…', 'success');
    window.location.href = 'otp.html?email=' + encodeURIComponent(email);
  });
</script>
</body>
</html>
