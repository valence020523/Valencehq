<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --black:#05070b; --navy-900:#0b1220; --gold:#cbb98d; --gold-bright:#e6d9b0;
    --panel:rgba(255,255,255,0.035); --border:rgba(255,255,255,0.09);
    --text:#f2f1ec; --text-dim:#93a0b4; --text-dimmer:#5c6779;
    --mono:'JetBrains Mono',monospace; --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --green:#7fd8a0; --red:#e88a8a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--black); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  header{
    display:flex; align-items:center; justify-content:space-between; padding:18px 30px;
    border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--navy-900),var(--black));
  }
  .logo-chip img{ display:block; height:30px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .brand-word{ font-weight:800; letter-spacing:0.16em; color:var(--gold-bright); font-size:15px; }
  .back-link{ font-size:12.5px; font-family:var(--mono); color:var(--text-dim); }
  .back-link:hover{ color:var(--gold-bright); }
  #signout-btn{
    font-size:12px; font-family:var(--mono); color:var(--text-dim); background:none;
    border:1px solid var(--border); border-radius:999px; padding:6px 14px; cursor:pointer; display:none;
  }
  #signout-btn:hover{ color:var(--gold-bright); border-color:var(--gold); }

  main{ max-width:560px; margin:0 auto; padding:60px 24px 90px; }
  h1{ font-size:22px; font-weight:800; margin:0 0 8px; }
  .sub{ font-size:13.5px; color:var(--text-dim); margin:0 0 30px; }

  .panel{ border:1px solid var(--border); background:var(--panel); border-radius:16px; padding:24px; }
  label{ display:block; font-size:11.5px; font-family:var(--mono); color:var(--text-dimmer); margin:16px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input{
    width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--border);
    background:rgba(255,255,255,0.03); color:var(--text); font-family:var(--sans); font-size:13.5px;
  }
  input:focus{ outline:none; border-color:var(--gold); }

  .btn{
    margin-top:22px; width:100%; font-size:13px; font-weight:700; letter-spacing:0.03em; color:var(--black);
    background:var(--gold-bright); border:none; border-radius:999px; padding:13px; cursor:pointer; font-family:var(--sans);
  }
  .btn:hover{ background:var(--gold); }
  .btn:disabled{ opacity:0.5; cursor:default; }

  .msg{ margin-top:16px; font-size:12.5px; font-family:var(--mono); }
  .msg.error{ color:var(--red); }
  .msg.success{ color:var(--green); }

  #app-section{ display:none; }
  #login-section{ display:block; }

  .recent{ margin-top:34px; }
  .recent h2{ font-size:13px; letter-spacing:0.05em; color:var(--text-dim); text-transform:uppercase; margin:0 0 12px; }
  .row{
    display:flex; justify-content:space-between; gap:12px; font-size:12.5px; padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .row span:first-child{ color:var(--text); font-family:var(--mono); }
  .row span:last-child{ color:var(--text-dim); text-align:right; }
</style>
</head>
<body>

<header>
  <div class="brandmark">
    <div class="logo-chip"><img src="valence-logo.png" alt="VALENCE"></div>
    <span class="brand-word">VALENCE ADMIN</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <a class="back-link" href="dashboard.html">&larr; BACK TO DASHBOARD</a>
    <button id="signout-btn">SIGN OUT</button>
  </div>
</header>

<main>
  <!-- LOGIN -->
  <section id="login-section">
    <h1>Admin Login</h1>
    <p class="sub">Sign in to add or manage verified products.</p>
    <div class="panel">
      <label for="email">EMAIL</label>
      <input type="email" id="email" autocomplete="username" />
      <label for="password">PASSWORD</label>
      <input type="password" id="password" autocomplete="current-password" />
      <button class="btn" id="login-btn">SIGN IN</button>
      <div class="msg" id="login-msg"></div>
    </div>
  </section>

  <!-- ADD PRODUCT -->
  <section id="app-section">
    <h1>Add Product</h1>
    <p class="sub">Create a new QR-verified product entry.</p>
    <div class="panel">
      <label for="qr_code">QR CODE (must be unique, e.g. VLC-0001)</label>
      <input type="text" id="qr_code" placeholder="VLC-0001" />
      <label for="product_name">PRODUCT NAME</label>
      <input type="text" id="product_name" placeholder="Wool Overcoat" />
      <label for="batch_number">BATCH NUMBER</label>
      <input type="text" id="batch_number" placeholder="BATCH-2026-01" />
      <label for="manufactured_at">MANUFACTURED DATE</label>
      <input type="date" id="manufactured_at" />
      <button class="btn" id="add-btn">ADD PRODUCT</button>
      <div class="msg" id="add-msg"></div>
    </div>

    <div class="recent">
      <h2>Recently added</h2>
      <div id="recent-list"></div>
    </div>
  </section>
</main>

<script>
  const loginSection = document.getElementById('login-section');
  const appSection = document.getElementById('app-section');
  const signoutBtn = document.getElementById('signout-btn');
  const loginMsg = document.getElementById('login-msg');
  const addMsg = document.getElementById('add-msg');
  const recentList = document.getElementById('recent-list');

  const ADMIN_EMAIL = 'mhilesjr@gmail.com';

  function showLoggedIn() {
    loginSection.style.display = 'none';
    appSection.style.display = 'block';
    signoutBtn.style.display = 'inline-block';
    loadRecent();
  }

  function showLoggedOut() {
    loginSection.style.display = 'block';
    appSection.style.display = 'none';
    signoutBtn.style.display = 'none';
  }

  async function checkSession() {
    const { data } = await supabase.auth.getSession();
    if (data.session && data.session.user?.email === ADMIN_EMAIL) {
      showLoggedIn();
    } else if (data.session) {
      // Logged in as someone else — the database will refuse writes anyway,
      // but don't even show the form.
      await supabase.auth.signOut();
      showLoggedOut();
      loginMsg.textContent = 'This admin page is restricted to an authorized account.';
      loginMsg.className = 'msg error';
    } else {
      showLoggedOut();
    }
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    loginMsg.textContent = '';
    loginMsg.className = 'msg';

    if (!email || !password) {
      loginMsg.textContent = 'Enter your email and password.';
      loginMsg.classList.add('error');
      return;
    }

    if (email.toLowerCase() !== ADMIN_EMAIL) {
      loginMsg.textContent = 'This admin page is restricted to an authorized account.';
      loginMsg.classList.add('error');
      return;
    }

    const { error, data } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      loginMsg.textContent = error.message;
      loginMsg.classList.add('error');
      return;
    }
    if (data.user?.email !== ADMIN_EMAIL) {
      await supabase.auth.signOut();
      loginMsg.textContent = 'This admin page is restricted to an authorized account.';
      loginMsg.classList.add('error');
      return;
    }
    showLoggedIn();
  });

  signoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    showLoggedOut();
  });

  document.getElementById('add-btn').addEventListener('click', async () => {
    const qr_code = document.getElementById('qr_code').value.trim();
    const product_name = document.getElementById('product_name').value.trim();
    const batch_number = document.getElementById('batch_number').value.trim();
    const manufactured_at = document.getElementById('manufactured_at').value || null;

    addMsg.textContent = '';
    addMsg.className = 'msg';

    if (!qr_code) {
      addMsg.textContent = 'QR code is required.';
      addMsg.classList.add('error');
      return;
    }

    const addBtn = document.getElementById('add-btn');
    addBtn.disabled = true;

    const { error } = await supabase
      .from('products')
      .insert([{ qr_code, product_name, batch_number, manufactured_at }]);

    addBtn.disabled = false;

    if (error) {
      addMsg.textContent = error.code === '23505'
        ? 'That QR code already exists — use a different one.'
        : error.message;
      addMsg.classList.add('error');
      return;
    }

    addMsg.textContent = `Added "${qr_code}" successfully.`;
    addMsg.classList.add('success');
    document.getElementById('qr_code').value = '';
    document.getElementById('product_name').value = '';
    document.getElementById('batch_number').value = '';
    document.getElementById('manufactured_at').value = '';
    loadRecent();
  });

  async function loadRecent() {
    const { data, error } = await supabase
      .from('products')
      .select('qr_code, product_name, batch_number')
      .order('created_at', { ascending: false })
      .limit(10);

    if (error || !data) {
      recentList.innerHTML = '<div class="row"><span>—</span><span>Could not load recent products</span></div>';
      return;
    }

    recentList.innerHTML = data.map(p => `
      <div class="row">
        <span>${escapeHtml(p.qr_code)}</span>
        <span>${escapeHtml(p.product_name || '—')} · ${escapeHtml(p.batch_number || '—')}</span>
      </div>
    `).join('') || '<div class="row"><span>—</span><span>No products yet</span></div>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  checkSession();
</script>
</body>
</html>
