<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --black:#050608; --navy-900:#0b1220;
    --champagne:#cbb98d; --champagne-bright:#e8dcb8; --bronze:#8a7355;
    --gold:var(--champagne); --gold-bright:var(--champagne-bright);
    --platinum:#d7dade; --platinum-dim:#9aa1a8; --platinum-glow:rgba(215,218,222,0.14);
    --garnet:#b9847a; --garnet-dim:#8c6058; --garnet-glow:rgba(185,132,122,0.14);
    --secure-green:#7fae8f;
    --panel:rgba(255,255,255,0.025); --panel-solid:#0b0d12;
    --border:rgba(255,255,255,0.08); --hairline:rgba(203,185,141,0.18);
    --text:#f3f1ea; --text-dim:#8b93a1; --text-dimmer:#565f6d;
    --mono:'JetBrains Mono',monospace; --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --serif:'Cormorant Garamond',Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{ margin:0; background:var(--black); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  svg{ display:block; }

  header{
    display:flex; align-items:center; justify-content:space-between; padding:16px 22px;
    border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--navy-900),var(--black));
    position:sticky; top:0; z-index:20;
  }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .logo-chip img{ display:block; height:26px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .brand-word{ font-weight:800; letter-spacing:0.16em; color:var(--gold-bright); font-size:13px; }
  .registry-pill{
    display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:9.5px;
    letter-spacing:0.12em; color:var(--champagne-bright); border:1px solid var(--hairline);
    border-radius:999px; padding:7px 12px; white-space:nowrap;
  }
  .registry-pill svg{ width:12px; height:12px; flex-shrink:0; }

  main{ max-width:480px; margin:0 auto; padding:0 0 40px; min-height:calc(100vh - 63px); }

  /* ---------------- Camera / scanning stage ---------------- */
  #scan-stage{ padding:26px 20px 0; }
  #scan-stage.hidden{ display:none; }
  .scan-heading{ text-align:center; margin-bottom:18px; }
  .scan-heading h1{ font-size:18px; font-weight:700; margin:0 0 6px; }
  .scan-heading p{ font-size:13px; line-height:1.6; color:var(--text-dim); margin:0; }

  #cam-frame{
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border);
    background:#000; aspect-ratio:1/1;
  }
  #qr-reader{ width:100%; height:100%; }
  #qr-reader video{ width:100% !important; height:100% !important; object-fit:cover; }
  #qr-reader__dashboard_section_csr button{
    font-family:var(--sans); font-size:12px; font-weight:600; color:var(--black);
    background:var(--gold-bright); border:none; border-radius:8px; padding:8px 14px; cursor:pointer;
  }
  #qr-reader__status_span{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  .scan-frame-overlay{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .scan-brackets{ position:relative; width:68%; aspect-ratio:1/1; }
  .scan-brackets span{ position:absolute; width:26px; height:26px; border:2.5px solid var(--gold-bright); }
  .scan-brackets span:nth-child(1){ top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .scan-brackets span:nth-child(2){ top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .scan-brackets span:nth-child(3){ bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .scan-brackets span:nth-child(4){ bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  .scan-line{
    position:absolute; left:6%; right:6%; height:2px; top:0;
    background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    box-shadow:0 0 10px 1px rgba(230,217,176,0.7);
    animation:sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ top:6%; opacity:0; }
    10%{ opacity:1; }
    50%{ top:94%; opacity:1; }
    60%{ opacity:0; }
  }

  .scan-footer{ padding:16px 4px 0; text-align:center; }
  .cancel-scan{
    font-family:var(--mono); font-size:12px; color:var(--text-dim); background:none;
    border:1px solid var(--border); border-radius:999px; padding:9px 20px; cursor:pointer;
  }
  .cancel-scan:hover{ color:var(--gold-bright); border-color:var(--gold); }
  .scan-note{ margin-top:14px; font-size:11.5px; color:var(--text-dimmer); font-family:var(--mono); text-align:center; }

  /* ---------------- Looking-up stage ---------------- */
  #lookup-stage{ padding:110px 24px; text-align:center; }
  #lookup-stage.hidden{ display:none; }
  .spinner{
    width:34px; height:34px; margin:0 auto 20px; border-radius:50%;
    border:2.5px solid var(--border); border-top-color:var(--gold-bright);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #lookup-stage p{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); }

  /* ---------------- Result / reveal stage ---------------- */
  #result-stage{ padding:38px 20px 0; }
  #result-stage.hidden{ display:none; }

  /* ---- Hero: ring, verdict headline, product identity ---- */
  .hero{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .hero-ring-wrap{ width:88px; height:88px; margin-bottom:20px; }
  .hero-ring{ transform-origin:52px 52px; }
  .hero-ring-wrap.valid svg{ filter:drop-shadow(0 0 10px var(--platinum-glow)); }
  .hero-ring-wrap.unclaimed svg{ filter:drop-shadow(0 0 10px rgba(203,185,141,0.28)); }
  .hero-ring-wrap.invalid svg{ filter:drop-shadow(0 0 10px var(--garnet-glow)); }
  .hero-ring-wrap svg{ animation:ring-in 0.8s cubic-bezier(.2,.8,.2,1) both; }
  .hero-mark{ stroke-dasharray:40; stroke-dashoffset:40; animation:check-in 0.4s 0.55s ease-out forwards; }
  @keyframes ring-in{ from{ opacity:0; transform:scale(0.7); } to{ opacity:1; transform:scale(1); } }
  @keyframes check-in{ to{ stroke-dashoffset:0; } }

  .hero-title{
    font-family:var(--sans); font-weight:700; font-size:22px;
    letter-spacing:0.34em; text-indent:0.34em; text-transform:uppercase;
  }
  .hero-title.valid{ color:var(--platinum); }
  .hero-title.unclaimed{ color:var(--champagne-bright); }
  .hero-title.invalid{ color:var(--garnet); }
  .hero-sub{
    font-family:var(--mono); font-size:10px; letter-spacing:0.2em; color:var(--text-dimmer);
    margin-top:8px; font-weight:500;
  }
  .hero-divider{ width:34px; height:1px; background:var(--hairline); margin:22px 0; }

  .hero-product-name{
    font-family:var(--serif); font-weight:600; font-size:32px; letter-spacing:0.02em;
    text-transform:uppercase; line-height:1.15;
  }
  .hero-tier{
    font-family:var(--mono); font-size:11px; letter-spacing:0.18em; color:var(--champagne-bright);
    margin-top:10px; font-weight:500;
  }
  .hero-edition-badge{
    font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:0.08em; color:var(--champagne-bright);
    border:1px solid var(--hairline); border-radius:6px; padding:8px 18px; margin-top:18px;
  }
  .hero-collection{
    font-family:var(--mono); font-size:10px; letter-spacing:0.16em; color:var(--text-dimmer);
    margin-top:14px; font-weight:500;
  }

  .unclaimed-message, .invalid-message{
    text-align:center; font-size:13px; line-height:1.65; color:var(--text-dim); margin:24px 0 0; padding:0 8px;
  }
  .claim-btn{
    display:block; text-align:center; font-size:12.5px; font-weight:600; letter-spacing:0.09em; color:var(--black);
    background:var(--champagne-bright); border:none; border-radius:999px; padding:14px; cursor:pointer; font-family:var(--sans);
    margin-top:22px; text-transform:uppercase;
  }
  .claim-btn:hover{ background:var(--champagne); }

  /* ---- Product image card ---- */
  .product-card{
    position:relative; margin-top:32px; border-radius:16px; overflow:hidden;
    border:1px solid var(--border); background:var(--panel-solid); aspect-ratio:4/3.4;
  }
  .product-card-watermark{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:600; font-size:220px; color:rgba(255,255,255,0.025);
    line-height:1; user-select:none; pointer-events:none;
  }
  .product-card-ring{
    position:absolute; top:50%; right:8%; width:150px; height:150px; transform:translateY(-50%);
    border:1px solid rgba(203,185,141,0.08); border-radius:50%; pointer-events:none;
  }
  .product-card-ring::before{
    content:''; position:absolute; inset:14px; border:1px solid rgba(203,185,141,0.06); border-radius:50%;
  }
  .product-card img{ position:relative; width:100%; height:100%; object-fit:cover; display:block; }
  .product-card-empty{
    position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
  }
  .product-card-empty svg{ width:34px; height:34px; opacity:0.35; }
  .product-card-empty span{
    position:relative; font-family:var(--mono); font-size:10px; letter-spacing:0.14em; color:var(--text-dimmer);
  }
  .product-card-badge{
    position:absolute; top:14px; left:14px; z-index:2; display:flex; align-items:center; gap:7px;
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em; color:var(--champagne-bright);
    background:rgba(5,6,8,0.55); backdrop-filter:blur(4px); border-radius:8px; padding:7px 10px;
  }
  .product-card-badge svg{ width:12px; height:12px; }

  /* ---- Authenticity-verified explainer strip ---- */
  .verify-panel{
    display:flex; gap:14px; align-items:flex-start; margin-top:24px; padding:18px 4px 22px;
    border-bottom:1px solid var(--hairline);
  }
  .verify-panel svg{ width:22px; height:22px; flex-shrink:0; margin-top:2px; }
  .verify-panel.valid svg{ color:var(--platinum); }
  .verify-panel.unclaimed svg{ color:var(--champagne-bright); }
  .verify-panel.invalid svg{ color:var(--garnet); }
  .verify-title{
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; font-weight:600; margin-bottom:5px;
  }
  .verify-panel.valid .verify-title{ color:var(--platinum); }
  .verify-panel.unclaimed .verify-title{ color:var(--champagne-bright); }
  .verify-panel.invalid .verify-title{ color:var(--garnet); }
  .verify-desc{ font-size:12.5px; line-height:1.6; color:var(--text-dim); }

  /* ---- Two-column icon data grid ---- */
  .data-grid{
    display:grid; grid-template-columns:1fr 1fr; column-gap:18px;
    padding:20px 0; border-bottom:1px solid var(--hairline);
  }
  .data-item{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; }
  .data-item svg{ width:15px; height:15px; flex-shrink:0; margin-top:3px; color:var(--bronze); }
  .data-label{ font-family:var(--mono); font-size:9px; letter-spacing:0.12em; color:var(--text-dimmer); margin-bottom:3px; }
  .data-value{ font-family:var(--serif); font-size:15px; font-weight:600; color:var(--text); line-height:1.3; }

  /* ---- Security status row ---- */
  .security-row{ display:flex; align-items:center; gap:12px; padding:18px 0; }
  .security-row svg{ width:18px; height:18px; flex-shrink:0; color:var(--champagne-bright); }
  .security-row .sec-body{ flex:1; }
  .sec-title{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; font-weight:600; color:var(--text); margin-bottom:3px; }
  .sec-desc{ font-size:11.5px; color:var(--text-dimmer); line-height:1.5; }
  .secure-pill{
    display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em;
    color:var(--secure-green); border:1px solid rgba(127,174,143,0.3); border-radius:999px; padding:6px 11px;
    white-space:nowrap;
  }
  .secure-dot{ width:5px; height:5px; border-radius:50%; background:var(--secure-green); }

  .action-row{ display:flex; gap:10px; margin-top:26px; }
  .scan-again, .dash-link{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    text-align:center; font-size:12px; font-weight:600; font-family:var(--sans);
    letter-spacing:0.1em; text-transform:uppercase; border-radius:999px; padding:13px; cursor:pointer;
  }
  .scan-again svg, .dash-link svg{ width:13px; height:13px; }
  .scan-again{ color:var(--black); background:var(--champagne-bright); border:1px solid var(--champagne-bright); }
  .scan-again:hover{ background:var(--champagne); border-color:var(--champagne); }
  .dash-link{ color:var(--text-dim); background:transparent; border:1px solid var(--border); }
  .dash-link:hover{ border-color:var(--bronze); color:var(--champagne-bright); }

  .debug-block{ margin-top:20px; padding:12px; border:1px dashed var(--border); border-radius:10px; }
  .debug-block .dt{ font-family:var(--mono); font-size:10.5px; color:var(--text-dimmer); margin-bottom:6px; }
  .debug-block .dv{ font-family:var(--mono); font-size:11px; color:var(--text); word-break:break-all; margin-bottom:8px; }

  /* ---------------- Site footer ---------------- */
  footer{
    max-width:480px; margin:0 auto; padding:28px 22px 34px; border-top:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center;
  }
  .footer-word{ font-family:var(--sans); font-weight:800; letter-spacing:0.22em; font-size:12px; color:var(--champagne-bright); }
  .footer-tag{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.08em; color:var(--text-dimmer); margin-top:6px; line-height:1.6; }
  .footer-mark img{ height:20px; width:auto; opacity:0.7; }
  .footer-meta{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; color:var(--text-dimmer); line-height:1.9; }
</style>
</head>
<body>

<header>
  <a class="brandmark" href="verify-authenticity.html">
    <div class="logo-chip"><img src="valence-logo.png" alt="VALENCE"></div>
    <span class="brand-word">VALENCE</span>
  </a>
  <div class="registry-pill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    AUTHENTICITY REGISTRY
  </div>
</header>

<main>

  <!-- Stage 1: camera opens immediately -->
  <div id="scan-stage">
    <div class="scan-heading">
      <h1>Scan Your Tag</h1>
      <p>Line up the QR code stitched or printed into your garment.</p>
    </div>
    <div id="cam-frame">
      <div id="qr-reader"></div>
      <div class="scan-frame-overlay">
        <div class="scan-brackets">
          <span></span><span></span><span></span><span></span>
          <div class="scan-line"></div>
        </div>
      </div>
    </div>
    <div class="scan-footer">
      <button class="cancel-scan" id="cancel-scan">CANCEL</button>
    </div>
    <div class="scan-note" id="scan-note"></div>
  </div>

  <!-- Stage 2: looking up the code -->
  <div id="lookup-stage" class="hidden">
    <div class="spinner"></div>
    <p>VERIFYING TAG…</p>
  </div>

  <!-- Stage 3: the reveal -->
  <div id="result-stage" class="hidden"></div>

</main>

<footer>
  <div>
    <div class="footer-word">VALENCE</div>
    <div class="footer-tag">MORE THAN CLOTHING.<br>IT'S A LEGACY.</div>
  </div>
  <div class="footer-mark"><img src="valence-logo.png" alt=""></div>
  <div class="footer-meta">
    <div>VALENCEHQ.COM</div>
    <div>© 2026 VALENCE. ALL RIGHTS RESERVED.</div>
  </div>
</footer>

<script>
  const scanStage = document.getElementById('scan-stage');
  const lookupStage = document.getElementById('lookup-stage');
  const resultStage = document.getElementById('result-stage');
  const scanNote = document.getElementById('scan-note');
  const cancelBtn = document.getElementById('cancel-scan');

  let html5QrCode = null;
  let isScanning = false;

  function showStage(stage) {
    [scanStage, lookupStage, resultStage].forEach(s => s.classList.add('hidden'));
    stage.classList.remove('hidden');
  }

  async function startScan() {
    scanNote.textContent = '';
    showStage(scanStage);
    try {
      if (typeof Html5Qrcode === 'undefined') {
        throw new Error('Html5Qrcode library failed to load (check network/CDN access).');
      }
      html5QrCode = new Html5Qrcode('qr-reader');
      await html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: (vw, vh) => {
            const edge = Math.floor(Math.min(vw, vh) * 0.72);
            return { width: edge, height: edge };
          }
        },
        onScanSuccess,
        () => { /* per-frame decode failures are expected while aiming — ignore */ }
      );
      isScanning = true;
    } catch (err) {
      scanNote.textContent = 'Camera unavailable — check permissions and try again.';
      console.error('Unable to start QR scanner', err);
    }
  }

  async function stopScan() {
    if (html5QrCode && isScanning) {
      try {
        await html5QrCode.stop();
        html5QrCode.clear();
      } catch (err) {
        console.error('Error stopping scanner', err);
      }
    }
    isScanning = false;
  }

  async function onScanSuccess(decodedText) {
    await stopScan();
    verifyCode(extractCode(decodedText), decodedText);
  }

  cancelBtn.addEventListener('click', async () => {
    await stopScan();
    window.location.href = 'verify-authenticity.html';
  });

  // A scanned QR may encode either a bare code ("VLC-001") or a full link
  // back to this page ("https://valencehq.vercel.app/product.html?code=VLC-001").
  function extractCode(raw) {
    const trimmed = (raw || '').trim();
    let extracted = trimmed;
    try {
      const url = new URL(trimmed);
      const fromParam = url.searchParams.get('code');
      if (fromParam) extracted = fromParam;
    } catch (e) {
      // not a URL — treat raw text as the code itself
    }
    return normalizeCode(extracted);
  }

  // Fixes common lookalike-character issues from copy/paste or autocorrect:
  // en dash / em dash / minus sign -> hyphen, zero-width chars removed.
  function normalizeCode(str) {
    return (str || '')
      .replace(/[\u2010-\u2015\u2212]/g, '-')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .trim()
      .toUpperCase();
  }

  function formatDate(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Look up the scanned code in Supabase and render the reveal ---
  // NOTE: adjust table/column names to match your schema. Expected columns
  // on `products`: qr_code, product_name, collection_name, batch_number,
  // manufactured_at, item_number, edition_name, edition_total, image_url,
  // owner_name, registered_at, security_hash.
  async function verifyCode(code, rawScanned) {
    showStage(lookupStage);

    if (typeof supabaseClient === 'undefined') {
      renderResult('invalid', { code }, 'Verification service is not configured.', rawScanned);
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .eq('qr_code', code)
        .maybeSingle();

      if (error) throw error;

      if (data) {
        const status = data.owner_name ? 'valid' : 'unclaimed';
        renderResult(status, { code, ...data }, null, rawScanned);
      } else {
        renderResult('invalid', { code }, 'This code does not match any known Valence product.', rawScanned);
      }
    } catch (err) {
      console.error('Verification lookup failed', err);
      renderResult('invalid', { code }, 'Could not reach the verification service. Please try again.', rawScanned);
    }
  }

  // ---------------- Icon set (all inline, single-color via currentColor) ----------------
  const icons = {
    shieldCheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke-linecap="round"/></svg>',
    package: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4.5 7.5L12 12l7.5-4.5M12 12v9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4" stroke-linecap="round"/></svg>',
    ribbon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="9" r="5.2"/><path d="M9 13.5L7.5 21l4.5-2.5 4.5 2.5-1.5-7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    shieldStar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M12 8.3l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z" stroke-linejoin="round"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke-linecap="round"/></svg>',
    scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-5-4.5-4 3.5-2.5-2L3.5 17" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5" stroke-linecap="round"/></svg>',
    dot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M12 9v7" stroke-linecap="round"/><circle cx="12" cy="18.4" r="0.6" fill="currentColor" stroke="none"/></svg>',
  };

  function heroRingSvg(kind) {
    // kind: 'valid' | 'unclaimed' | 'invalid'
    const stroke = kind === 'valid' ? 'var(--platinum)' : kind === 'invalid' ? 'var(--garnet)' : 'var(--champagne-bright)';
    const mark = kind === 'valid'
      ? '<path class="hero-mark" d="M35 53l11 11 21-24" stroke-linecap="round" stroke-linejoin="round"/>'
      : kind === 'invalid'
        ? '<path class="hero-mark" d="M40 40l22 22M62 40l-22 22" stroke-linecap="round"/>'
        : '<path class="hero-mark" d="M52 34v23" stroke-linecap="round"/><circle cx="52" cy="65" r="2" fill="' + stroke + '" stroke="none"/>';
    return `
      <svg class="hero-ring" viewBox="0 0 104 104" fill="none" stroke="${stroke}" stroke-width="2">
        ${mark}
        <circle cx="52" cy="52" r="42" stroke-width="1.4" opacity="0.9"/>
      </svg>
    `;
  }

  function renderResult(status, data, message, rawScanned) {
    showStage(resultStage);

    const valid = status === 'valid';
    const unclaimed = status === 'unclaimed';
    const invalid = !valid && !unclaimed;

    const itemName = data.product_name || 'Valence Item';
    const collectionName = data.collection_name;
    const editionName = data.edition_name; // e.g. "Founder Edition"
    const editionTotal = data.edition_total;
    const itemNumber = data.item_number || data.code;
    const editionBadge = editionTotal
      ? `#${String(itemNumber).padStart(3, '0')} / ${editionTotal}`
      : (itemNumber ? `#${itemNumber}` : null);

    const heroKind = valid ? 'valid' : (unclaimed ? 'unclaimed' : 'invalid');
    const heroTitle = valid ? 'AUTHENTIC' : (unclaimed ? 'UNCONFIRMED' : 'NOT VERIFIED');
    const heroSub = valid ? 'VERIFIED BY VALENCE' : (unclaimed ? 'AWAITING CUSTOMER CONFIRMATION' : 'NO REGISTRY MATCH');

    let html = `
      <div class="hero">
        <div class="hero-ring-wrap ${heroKind}">${heroRingSvg(heroKind)}</div>
        <div class="hero-title ${heroKind}">${heroTitle}</div>
        <div class="hero-sub">${heroSub}</div>
    `;

    if (valid || unclaimed) {
      html += `
        <div class="hero-divider"></div>
        <div class="hero-product-name">${escapeHtml(itemName)}</div>
      `;
      if (editionName) html += `<div class="hero-tier">${escapeHtml(editionName.toUpperCase())}</div>`;
      if (editionBadge) html += `<div class="hero-edition-badge">${escapeHtml(editionBadge)}</div>`;
      if (collectionName) html += `<div class="hero-collection">${escapeHtml(collectionName.toUpperCase())}</div>`;
    }

    if (unclaimed) {
      html += `<p class="unclaimed-message">This item hasn't been confirmed yet. Enter the retailer's one-time code to confirm this is an original VALENCE product.</p>`;
      html += `<a class="claim-btn" href="claim.html?code=${encodeURIComponent(data.code)}">CONFIRM PRODUCT FOR AUTHENTICITY</a>`;
    } else if (invalid) {
      html += `<p class="invalid-message">${escapeHtml(message || 'This code could not be verified.')}</p>`;
    }

    html += `</div>`; // close .hero

    // Product image card (valid + unclaimed only — no product identity for invalid codes)
    if (valid || unclaimed) {
      html += `<div class="product-card">`;
      html += `<div class="product-card-badge">${icons.lock}<span>OFFICIAL PRODUCT</span></div>`;
      html += `<div class="product-card-watermark">V</div><div class="product-card-ring"></div>`;
      if (data.image_url) {
        html += `<img src="${escapeHtml(data.image_url)}" alt="${escapeHtml(itemName)}" />`;
      } else {
        html += `<div class="product-card-empty">${icons.image}<span>PHOTO NOT YET UPLOADED</span></div>`;
      }
      html += `</div>`;
    }

    // Authenticity explainer strip
    const verifyTitle = valid ? 'AUTHENTICITY VERIFIED' : (unclaimed ? 'AWAITING CONFIRMATION' : 'NOT VERIFIED');
    const verifyDesc = valid
      ? 'This product has been verified against the official VALENCE registry.'
      : (unclaimed
        ? 'This product exists in the VALENCE registry but hasn\u2019t been confirmed as authentic by its owner yet.'
        : 'This code does not match any record in the VALENCE registry.');
    const verifyIcon = valid ? icons.shieldCheck : (unclaimed ? icons.dot : icons.x);
    html += `
      <div class="verify-panel ${heroKind}">
        ${verifyIcon}
        <div>
          <div class="verify-title">${verifyTitle}</div>
          <div class="verify-desc">${verifyDesc}</div>
        </div>
      </div>
    `;

    // Two-column data grid
    if (valid) {
      html += `
        <div class="data-grid">
          <div class="data-item">${icons.shieldCheck}<div><div class="data-label">PRODUCT</div><div class="data-value">${escapeHtml(itemName)}</div></div></div>
          <div class="data-item">${icons.person}<div><div class="data-label">REGISTERED OWNER</div><div class="data-value">${escapeHtml(data.owner_name || '—')}</div></div></div>
          <div class="data-item">${icons.package}<div><div class="data-label">COLLECTION</div><div class="data-value">${escapeHtml(collectionName || '—')}</div></div></div>
          <div class="data-item">${icons.calendar}<div><div class="data-label">REGISTERED ON</div><div class="data-value">${escapeHtml(formatDate(data.registered_at))}</div></div></div>
          <div class="data-item">${icons.ribbon}<div><div class="data-label">EDITION</div><div class="data-value">${escapeHtml(editionBadge || '—')}</div></div></div>
          <div class="data-item">${icons.shieldStar}<div><div class="data-label">MANUFACTURED ON</div><div class="data-value">${escapeHtml(formatDate(data.manufactured_at))}</div></div></div>
        </div>
      `;
    } else if (unclaimed) {
      html += `
        <div class="data-grid">
          <div class="data-item">${icons.shieldCheck}<div><div class="data-label">PRODUCT</div><div class="data-value">${escapeHtml(itemName)}</div></div></div>
          <div class="data-item">${icons.package}<div><div class="data-label">COLLECTION</div><div class="data-value">${escapeHtml(collectionName || '—')}</div></div></div>
          <div class="data-item">${icons.ribbon}<div><div class="data-label">EDITION</div><div class="data-value">${escapeHtml(editionBadge || '—')}</div></div></div>
          <div class="data-item">${icons.shieldStar}<div><div class="data-label">MANUFACTURED ON</div><div class="data-value">${escapeHtml(formatDate(data.manufactured_at))}</div></div></div>
        </div>
      `;
    }

    // Security status row (valid + unclaimed only)
    if (valid || unclaimed) {
      html += `
        <div class="security-row">
          ${icons.shieldCheck}
          <div class="sec-body">
            <div class="sec-title">SECURITY STATUS</div>
            <div class="sec-desc">Protected by VALENCE registry verification${data.security_hash ? ` · token ${escapeHtml(data.security_hash)}` : ''}.</div>
          </div>
          <div class="secure-pill"><span class="secure-dot"></span>SECURE</div>
        </div>
      `;
    }

    if (invalid && rawScanned) {
      const codeVal = data.code || '';
      const charCodes = Array.from(codeVal).map(ch => ch.charCodeAt(0).toString(16).padStart(4, '0')).join(' ');
      html += `
        <div class="debug-block">
          <div class="dt">DEBUG — RAW SCANNED TEXT</div>
          <div class="dv">${escapeHtml(rawScanned)}</div>
          <div class="dt">EXTRACTED CODE CHAR CODES (hex)</div>
          <div class="dv">${escapeHtml(charCodes)}</div>
        </div>
      `;
    }

    html += `
      <div class="action-row">
        <button class="scan-again" id="scan-again-btn">${icons.scan}SCAN ANOTHER</button>
        <a class="dash-link" href="dashboard.html">VIEW DASHBOARD${icons.arrow}</a>
      </div>
    `;

    resultStage.innerHTML = html;
    document.getElementById('scan-again-btn').addEventListener('click', startScan);
  }

  // --- Entry point ---
  // If the QR encoded a link with ?code=, or verify-authenticity.html
  // forwarded one, skip straight to the lookup. Otherwise open the camera
  // immediately — no extra tap required.
  const params = new URLSearchParams(window.location.search);
  const codeFromUrl = params.get('code');
  if (codeFromUrl) {
    verifyCode(normalizeCode(codeFromUrl), codeFromUrl);
  } else {
    startScan();
  }
</script>
</body>
</html>
