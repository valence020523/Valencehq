<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --black:#050608; --navy-900:#0b1220;
    --champagne:#cbb98d; --champagne-bright:#e8dcb8; --bronze:#8a7355;
    --gold:var(--champagne); --gold-bright:var(--champagne-bright);
    --platinum:#d7dade; --platinum-dim:#9aa1a8; --platinum-glow:rgba(215,218,222,0.14);
    --garnet:#b9847a; --garnet-dim:#8c6058; --garnet-glow:rgba(185,132,122,0.14);
    --mint:#8fd6ac; --mint-dim:#6fa889;
    --panel:rgba(255,255,255,0.025); --panel-solid:#0b0d12; --panel-raised:#0e1015;
    --border:rgba(255,255,255,0.08); --hairline:rgba(203,185,141,0.18);
    --hero-border:rgba(203,185,141,0.32);
    --text:#f3f1ea; --text-dim:#8b93a1; --text-dimmer:#565f6d;
    --mono:'JetBrains Mono',monospace; --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --serif:'Cormorant Garamond',Georgia,serif; --script:'Dancing Script',cursive;
    --content-max:1040px;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{ margin:0; background:var(--black); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  svg{ display:block; }
  button{ font-family:inherit; }

  header{
    border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--navy-900),var(--black));
    position:sticky; top:0; z-index:20; padding:16px 22px;
  }
  .header-inner{
    max-width:var(--content-max); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brandmark{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .logo-chip img{ display:block; height:26px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .brand-word{ font-weight:800; letter-spacing:0.16em; color:var(--gold-bright); font-size:13px; }

  .registry-pill{
    display:flex; align-items:center; gap:8px; border:1px solid var(--hairline);
    border-radius:999px; padding:7px 12px;
  }
  .registry-pill svg{ width:14px; height:14px; flex-shrink:0; color:var(--champagne-bright); }
  .registry-pill-text{ line-height:1.35; }
  .registry-pill-title{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.1em; color:var(--champagne-bright); font-weight:600; }
  .registry-pill-sub{ font-family:var(--mono); font-size:7.5px; letter-spacing:0.14em; color:var(--text-dimmer); }

  .owner-pill{ display:flex; align-items:center; gap:9px; }
  .owner-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(150deg,var(--champagne),var(--bronze));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:12.5px; color:var(--black);
  }
  .owner-pill-text{ line-height:1.3; text-align:right; }
  .owner-pill-title{ font-family:var(--mono); font-size:8.5px; letter-spacing:0.1em; color:var(--champagne-bright); font-weight:600; }
  .owner-pill-name{ font-family:var(--serif); font-size:13px; font-weight:600; color:var(--text); }
  .owner-pill svg{ width:11px; height:11px; color:var(--text-dimmer); flex-shrink:0; }

  main{ max-width:var(--content-max); margin:0 auto; padding:0 0 40px; min-height:calc(100vh - 63px); }

  /* ---------------- Camera / scanning stage ---------------- */
  #scan-stage{ padding:26px 20px 0; }
  #scan-stage.hidden{ display:none; }
  .scan-heading{ text-align:center; margin-bottom:18px; }
  .scan-heading h1{ font-size:18px; font-weight:700; margin:0 0 6px; }
  .scan-heading p{ font-size:13px; line-height:1.6; color:var(--text-dim); margin:0; }

  #cam-frame{
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border);
    background:#000; aspect-ratio:1/1;
  }
  #qr-reader{ width:100%; height:100%; }
  #qr-reader video{ width:100% !important; height:100% !important; object-fit:cover; }
  #qr-reader__dashboard_section_csr button{
    font-family:var(--sans); font-size:12px; font-weight:600; color:var(--black);
    background:var(--gold-bright); border:none; border-radius:8px; padding:8px 14px; cursor:pointer;
  }
  #qr-reader__status_span{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  .scan-frame-overlay{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .scan-brackets{ position:relative; width:68%; aspect-ratio:1/1; }
  .scan-brackets span{ position:absolute; width:26px; height:26px; border:2.5px solid var(--gold-bright); }
  .scan-brackets span:nth-child(1){ top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .scan-brackets span:nth-child(2){ top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .scan-brackets span:nth-child(3){ bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .scan-brackets span:nth-child(4){ bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  .scan-line{
    position:absolute; left:6%; right:6%; height:2px; top:0;
    background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    box-shadow:0 0 10px 1px rgba(230,217,176,0.7);
    animation:sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ top:6%; opacity:0; }
    10%{ opacity:1; }
    50%{ top:94%; opacity:1; }
    60%{ opacity:0; }
  }

  .scan-footer{ padding:16px 4px 0; text-align:center; }
  .cancel-scan{
    font-family:var(--mono); font-size:12px; color:var(--text-dim); background:none;
    border:1px solid var(--border); border-radius:999px; padding:9px 20px; cursor:pointer;
  }
  .cancel-scan:hover{ color:var(--gold-bright); border-color:var(--gold); }
  .scan-note{ margin-top:14px; font-size:11.5px; color:var(--text-dimmer); font-family:var(--mono); text-align:center; }

  /* ---------------- Looking-up stage ---------------- */
  #lookup-stage{ padding:110px 24px; text-align:center; }
  #lookup-stage.hidden{ display:none; }
  .spinner{
    width:34px; height:34px; margin:0 auto 20px; border-radius:50%;
    border:2.5px solid var(--border); border-top-color:var(--gold-bright);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #lookup-stage p{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); }

  /* ---------------- Result / reveal stage ---------------- */
  #result-stage{ padding:20px 18px 0; }
  #result-stage.hidden{ display:none; }

  /* ================= HERO CARD (both branches) ================= */
  .hero-card{
    border:1px solid var(--hero-border); border-radius:18px; padding:26px 20px;
    background:radial-gradient(120% 100% at 50% 0%, rgba(203,185,141,0.05), transparent 55%), var(--panel-solid);
  }
  .hero-eyebrow{
    font-family:var(--mono); font-size:10px; letter-spacing:0.2em; font-weight:600; margin-bottom:8px;
  }
  .hero-eyebrow.mint{ color:var(--mint); }
  .hero-col-text, .hero-col-image{ min-width:0; }
  .hero-headline{
    font-family:var(--serif); font-weight:600; font-size:34px; line-height:1.08; letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .hero-headline .accent{ color:var(--champagne-bright); display:block; }
  .hero-body{ font-size:13px; line-height:1.65; color:var(--text-dim); margin-top:14px; max-width:34ch; }
  .hero-divider{ width:34px; height:1px; background:var(--hairline); margin:18px 0; }

  .hero-ring-row{ display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .hero-ring{ width:64px; height:64px; flex-shrink:0; filter:drop-shadow(0 0 8px rgba(203,185,141,0.25)); }

  .hero-signature{ display:flex; flex-direction:column; margin-top:22px; }
  .hero-signature-word{ font-family:var(--script); font-size:30px; color:var(--champagne-bright); line-height:1; }
  .hero-signature-caption{ font-family:var(--mono); font-size:9px; letter-spacing:0.16em; color:var(--text-dimmer); margin-top:6px; }

  .hero-info-box{
    display:flex; gap:11px; align-items:flex-start; border:1px solid var(--hairline); border-radius:10px;
    padding:13px 14px; margin-top:18px;
  }
  .hero-info-box svg{ width:15px; height:15px; flex-shrink:0; margin-top:1px; color:var(--champagne-bright); }
  .hero-info-box span{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; line-height:1.6; color:var(--champagne-bright); font-weight:500; }
  .hero-note{ font-size:12px; line-height:1.6; color:var(--text-dimmer); margin-top:14px; }

  /* ---- product image + overlay name card ---- */
  .product-card{
    position:relative; margin-top:22px; border-radius:14px; overflow:hidden;
    border:1px solid var(--border); background:var(--panel-solid); aspect-ratio:1/1.05;
  }
  .product-card-watermark{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:600; font-size:210px; color:rgba(255,255,255,0.025);
    line-height:1; user-select:none; pointer-events:none;
  }
  .product-card-ring{
    position:absolute; top:50%; right:6%; width:160px; height:160px; transform:translateY(-50%);
    border:1px solid rgba(203,185,141,0.09); border-radius:50%; pointer-events:none;
  }
  .product-card-ring::before{ content:''; position:absolute; inset:16px; border:1px solid rgba(203,185,141,0.07); border-radius:50%; }
  .product-card img{ position:relative; width:100%; height:100%; object-fit:cover; display:block; }
  .product-card-empty{
    position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
  }
  .product-card-empty svg{ width:34px; height:34px; opacity:0.35; }
  .product-card-empty span{ position:relative; font-family:var(--mono); font-size:10px; letter-spacing:0.14em; color:var(--text-dimmer); }
  .product-card-badge{
    position:absolute; top:12px; right:12px; z-index:2; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.08em; color:var(--mint);
    background:rgba(5,6,8,0.6); backdrop-filter:blur(4px); border-radius:8px; padding:6px 10px;
  }
  .product-card-badge svg{ width:12px; height:12px; }
  .product-card-name{
    position:absolute; left:10px; right:10px; bottom:10px; z-index:2;
    border:1px solid var(--hero-border); border-radius:10px; padding:14px 16px;
    background:rgba(5,6,8,0.72); backdrop-filter:blur(6px); text-align:center;
  }
  .product-card-name .pname{ font-family:var(--serif); font-weight:600; font-size:21px; text-transform:uppercase; line-height:1.15; }
  .product-card-name .ptier{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.14em; color:var(--champagne-bright); margin-top:6px; font-weight:600; }
  .product-card-name .pedition{
    display:inline-block; margin-top:10px; font-family:var(--mono); font-size:12px; font-weight:700;
    letter-spacing:0.06em; color:var(--champagne-bright); border:1px solid var(--hairline); border-radius:6px; padding:5px 14px;
  }

  /* ================= DETAIL PANELS (shared building blocks) ================= */
  .panel-box{ border:1px solid var(--border); border-radius:14px; padding:18px 16px; background:var(--panel-raised); }
  .section-gap > .panel-box + .panel-box{ margin-top:14px; }
  .two-col-grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  .panel-box-header{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .panel-box-header svg{ width:15px; height:15px; color:var(--champagne-bright); flex-shrink:0; }
  .panel-box-header span{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; font-weight:600; color:var(--champagne-bright); }

  .detail-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
  .detail-row:last-child{ border-bottom:none; padding-bottom:2px; }
  .detail-row svg{ width:14px; height:14px; color:var(--bronze); flex-shrink:0; margin-top:2px; }
  .detail-row-body{ flex:1; display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .detail-label{ font-size:11px; color:var(--text-dimmer); }
  .detail-value{ font-family:var(--serif); font-size:15px; font-weight:600; color:var(--text); text-align:right; }
  .detail-value.mono{ font-family:var(--mono); font-size:12px; letter-spacing:0.03em; }
  .detail-value.mint{ color:var(--mint); }
  .detail-value.status{ display:flex; align-items:center; gap:6px; }
  .status-dot{ width:6px; height:6px; border-radius:50%; background:var(--mint); flex-shrink:0; }

  /* icon-grid variant (Product Details, Your Product Details) */
  .icon-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px 14px; }
  .icon-grid-item svg{ width:16px; height:16px; color:var(--bronze); margin-bottom:8px; }
  .icon-grid-label{ font-family:var(--mono); font-size:9px; letter-spacing:0.1em; color:var(--text-dimmer); margin-bottom:4px; }
  .icon-grid-value{ font-family:var(--serif); font-size:15px; font-weight:600; color:var(--text); }

  .panel-desc{ font-size:12px; line-height:1.6; color:var(--text-dim); }
  .panel-inner-divider{ height:1px; background:rgba(255,255,255,0.06); margin:14px 0; }

  .founder-badge-icon{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--hero-border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background:radial-gradient(circle, rgba(203,185,141,0.12), transparent 70%);
  }
  .founder-badge-icon svg{ width:17px; height:17px; color:var(--champagne-bright); }
  .founder-heading{ font-family:var(--serif); font-size:19px; font-weight:600; margin:8px 0 6px; }

  .panel-cta{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px;
    font-family:var(--sans); font-size:11.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--black); background:var(--champagne-bright); border:none; border-radius:999px; padding:12px; cursor:pointer;
  }
  .panel-cta:hover{ background:var(--champagne); }
  .panel-cta svg{ width:12px; height:12px; }
  .panel-cta.outline{
    color:var(--champagne-bright); background:transparent; border:1px solid var(--hairline);
  }
  .panel-cta.outline:hover{ border-color:var(--champagne); }

  /* seal + qr verification panel */
  .verify-registry-row{ }
  .verify-registry-top{ display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .verify-seal{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--hero-border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background:var(--panel-solid);
    font-family:var(--serif); font-weight:700; font-size:20px; color:var(--champagne-bright);
  }
  .verify-registry-text{ flex:1; }
  .qr-block{ text-align:center; flex-shrink:0; }
  .qr-block img{ width:64px; height:64px; border-radius:6px; background:#fff; padding:4px; }
  .qr-block span{ display:block; margin-top:6px; font-family:var(--mono); font-size:8.5px; letter-spacing:0.08em; color:var(--text-dimmer); }

  .hanger-panel-row{ }
  .hanger-row{ display:flex; gap:12px; align-items:flex-start; }
  .hanger-row svg{ width:18px; height:18px; color:var(--champagne-bright); flex-shrink:0; margin-top:2px; }

  /* benefits grid (Genesis exclusive access) */
  .benefits-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .benefit-card{ border:1px solid var(--border); border-radius:10px; padding:14px 12px; }
  .benefit-card svg{ width:18px; height:18px; color:var(--champagne-bright); margin-bottom:9px; }
  .benefit-card-title{ font-size:12.5px; font-weight:700; margin-bottom:4px; }
  .benefit-card-desc{ font-size:10.5px; line-height:1.5; color:var(--text-dimmer); }

  .section-gap{ margin-top:14px; }

  .unclaimed-message, .invalid-message{
    text-align:center; font-size:13px; line-height:1.65; color:var(--text-dim); margin:14px 0 0; padding:0 4px;
  }
  .claim-btn{
    display:block; text-align:center; font-size:12.5px; font-weight:700; letter-spacing:0.09em; color:var(--black);
    background:var(--champagne-bright); border:none; border-radius:999px; padding:14px; cursor:pointer; font-family:var(--sans);
    margin-top:18px; text-transform:uppercase; width:100%;
  }
  .claim-btn:hover{ background:var(--champagne); }

  .action-row{ display:flex; gap:10px; margin-top:20px; }
  .scan-again, .dash-link{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    text-align:center; font-size:11.5px; font-weight:700; font-family:var(--sans);
    letter-spacing:0.08em; text-transform:uppercase; border-radius:999px; padding:13px; cursor:pointer;
  }
  .scan-again svg, .dash-link svg{ width:13px; height:13px; }
  .scan-again{ color:var(--black); background:var(--champagne-bright); border:1px solid var(--champagne-bright); }
  .scan-again:hover{ background:var(--champagne); border-color:var(--champagne); }
  .dash-link{ color:var(--text-dim); background:transparent; border:1px solid var(--border); }
  .dash-link:hover{ border-color:var(--bronze); color:var(--champagne-bright); }

  .debug-block{ margin-top:20px; padding:12px; border:1px dashed var(--border); border-radius:10px; }
  .debug-block .dt{ font-family:var(--mono); font-size:10.5px; color:var(--text-dimmer); margin-bottom:6px; }
  .debug-block .dv{ font-family:var(--mono); font-size:11px; color:var(--text); word-break:break-all; margin-bottom:8px; }

  /* ---- generic hero for unclaimed / invalid states ---- */
  .simple-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:16px 4px 0; }
  .simple-ring-wrap{ width:80px; height:80px; margin-bottom:18px; }
  .simple-ring-wrap svg{ animation:ring-in 0.8s cubic-bezier(.2,.8,.2,1) both; }
  .simple-mark{ stroke-dasharray:40; stroke-dashoffset:40; animation:check-in 0.4s 0.55s ease-out forwards; }
  @keyframes ring-in{ from{ opacity:0; transform:scale(0.7); } to{ opacity:1; transform:scale(1); } }
  @keyframes check-in{ to{ stroke-dashoffset:0; } }
  .simple-title{ font-family:var(--sans); font-weight:700; font-size:20px; letter-spacing:0.3em; text-indent:0.3em; text-transform:uppercase; }
  .simple-sub{ font-family:var(--mono); font-size:10px; letter-spacing:0.18em; color:var(--text-dimmer); margin-top:8px; }

  /* ---------------- Site footer ---------------- */
  footer{
    max-width:var(--content-max); margin:0 auto; padding:28px 22px 34px; border-top:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center;
  }
  .footer-word{ font-family:var(--sans); font-weight:800; letter-spacing:0.22em; font-size:12px; color:var(--champagne-bright); }
  .footer-tag{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.08em; color:var(--text-dimmer); margin-top:6px; line-height:1.6; }
  .footer-mark img{ height:20px; width:auto; opacity:0.7; }
  .footer-meta{ font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em; color:var(--text-dimmer); line-height:1.9; }

  /* ================= Desktop breakpoint: match the reference composition ================= */
  @media (min-width: 860px){
    main{ padding:0 32px 60px; }
    #result-stage{ padding:32px 0 0; }
    footer{ flex-direction:row; justify-content:space-between; text-align:left; padding:32px 32px 40px; }
    .footer-brand-block{ text-align:left; }
    .footer-meta{ text-align:right; }

    .hero-card{ padding:40px; display:grid; grid-template-columns:1.05fr 0.95fr; gap:44px; align-items:start; }
    .hero-col-image .product-card{ margin-top:0; }
    .hero-headline{ font-size:44px; }
    .hero-eyebrow{ font-size:11px; }
    .hero-body{ font-size:14px; max-width:none; }
    .hero-ring{ width:76px; height:76px; }
    .product-card{ aspect-ratio:4/4.6; }

    .two-col-grid{ grid-template-columns:1fr 1fr; gap:18px; }

    .verify-registry-row{ display:flex; align-items:center; gap:24px; }
    .verify-registry-top{ margin-bottom:0; flex:1; }
    .qr-block{ margin-left:auto; }

<script>
  const scanStage = document.getElementById('scan-stage');
  const lookupStage = document.getElementById('lookup-stage');
  const resultStage = document.getElementById('result-stage');
  const scanNote = document.getElementById('scan-note');
  const cancelBtn = document.getElementById('cancel-scan');
  const headerRight = document.getElementById('header-right');

  const DEFAULT_HEADER_RIGHT = headerRight.innerHTML;

  let html5QrCode = null;
  let isScanning = false;

  function showStage(stage) {
    [scanStage, lookupStage, resultStage].forEach(s => s.classList.add('hidden'));
    stage.classList.remove('hidden');
  }

  async function startScan() {
    scanNote.textContent = '';
    headerRight.innerHTML = DEFAULT_HEADER_RIGHT;
    showStage(scanStage);
    try {
      if (typeof Html5Qrcode === 'undefined') {
        throw new Error('Html5Qrcode library failed to load (check network/CDN access).');
      }
      html5QrCode = new Html5Qrcode('qr-reader');
      await html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: (vw, vh) => {
            const edge = Math.floor(Math.min(vw, vh) * 0.72);
            return { width: edge, height: edge };
          }
        },
        onScanSuccess,
        () => { /* per-frame decode failures are expected while aiming — ignore */ }
      );
      isScanning = true;
    } catch (err) {
      scanNote.textContent = 'Camera unavailable — check permissions and try again.';
      console.error('Unable to start QR scanner', err);
    }
  }

  async function stopScan() {
    if (html5QrCode && isScanning) {
      try {
        await html5QrCode.stop();
        html5QrCode.clear();
      } catch (err) {
        console.error('Error stopping scanner', err);
      }
    }
    isScanning = false;
  }

  async function onScanSuccess(decodedText) {
    await stopScan();
    verifyCode(extractCode(decodedText), decodedText);
  }

  cancelBtn.addEventListener('click', async () => {
    await stopScan();
    window.location.href = 'verify-authenticity.html';
  });

  // A scanned QR may encode either a bare code ("VLC-001") or a full link
  // back to this page ("https://valencehq.vercel.app/product.html?code=VLC-001").
  function extractCode(raw) {
    const trimmed = (raw || '').trim();
    let extracted = trimmed;
    try {
      const url = new URL(trimmed);
      const fromParam = url.searchParams.get('code');
      if (fromParam) extracted = fromParam;
    } catch (e) {
      // not a URL — treat raw text as the code itself
    }
    return normalizeCode(extracted);
  }

  // Fixes common lookalike-character issues from copy/paste or autocorrect:
  // en dash / em dash / minus sign -> hyphen, zero-width chars removed.
  function normalizeCode(str) {
    return (str || '')
      .replace(/[\u2010-\u2015\u2212]/g, '-')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .trim()
      .toUpperCase();
  }

  function formatDate(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function initials(name) {
    if (!name) return 'V';
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  }

  function isGenesisCollection(collectionName) {
    return (collectionName || '').toLowerCase().includes('genesis');
  }

  // --- Look up the scanned code in Supabase and render the reveal ---
  // NOTE: adjust table/column names to match your schema. Expected columns
  // on `products`: qr_code, product_name, collection_name, image_url, size,
  // color, batch_number, release_date, manufactured_at, item_number,
  // edition_name, edition_total, owner_name, owner_id, registered_at,
  // security_hash.
  async function verifyCode(code, rawScanned) {
    showStage(lookupStage);

    if (typeof supabaseClient === 'undefined') {
      renderResult('invalid', { code }, 'Verification service is not configured.', rawScanned);
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .eq('qr_code', code)
        .maybeSingle();

      if (error) throw error;

      if (data) {
        const status = data.owner_name ? 'valid' : 'unclaimed';
        // Only the actual registered account sees the personalized "you
        // are the owner" experience — never inferred from just having an
        // owner_name on file, since anyone can scan a public QR code.
        let isOwnerViewing = false;
        if (status === 'valid' && data.owner_id) {
          try {
            const { data: sessionData } = await supabaseClient.auth.getSession();
            const currentUserId = sessionData?.session?.user?.id || null;
            isOwnerViewing = !!currentUserId && currentUserId === data.owner_id;
          } catch (sessionErr) {
            console.error('Session check failed', sessionErr);
          }
        }
        renderResult(status, { code, ...data, _isOwnerViewing: isOwnerViewing }, null, rawScanned);
      } else {
        renderResult('invalid', { code }, 'This code does not match any known Valence product.', rawScanned);
      }
    } catch (err) {
      console.error('Verification lookup failed', err);
      renderResult('invalid', { code }, 'Could not reach the verification service. Please try again.', rawScanned);
    }
  }

  function simpleRingSvg(kind) {
    const stroke = kind === 'valid' ? 'var(--platinum)' : kind === 'invalid' ? 'var(--garnet)' : 'var(--champagne-bright)';
    const mark = kind === 'valid'
      ? '<path class="simple-mark" d="M35 53l11 11 21-24" stroke-linecap="round" stroke-linejoin="round"/>'
      : kind === 'invalid'
        ? '<path class="simple-mark" d="M40 40l22 22M62 40l-22 22" stroke-linecap="round"/>'
        : '<path class="simple-mark" d="M52 34v23" stroke-linecap="round"/><circle cx="52" cy="65" r="2" fill="' + stroke + '" stroke="none"/>';
    return `<svg viewBox="0 0 104 104" fill="none" stroke="${stroke}" stroke-width="2">${mark}<circle cx="52" cy="52" r="42" stroke-width="1.4" opacity="0.9"/></svg>`;
  }

  function qrImageUrl(code) {
    const verifyUrl = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}product.html?code=${encodeURIComponent(code)}`;
    return `https://api.qrserver.com/v1/create-qr-code/?size=140x140&bgcolor=ffffff&color=050608&margin=0&data=${encodeURIComponent(verifyUrl)}`;
  }

  function productCardMarkup(data, itemName, tierLabel, editionBadge, verifiedBadge) {

      html += `<img src="${escapeHtml(data.image_url)}" alt="${escapeHtml(itemName)}" />`;
    } else {
      html += `<div class="product-card-empty">${icons.image}<span>PHOTO NOT YET UPLOADED</span></div>`;

    html += `
      <div class="product-card-name">

        ${tierLabel ? `<div class="ptier">${escapeHtml(tierLabel.toUpperCase())}</div>` : ''}

      </div>
    `;
    html += `</div>`;
    return html;
  }

  function editionBadgeFor(data) {
    const itemNumber = data.item_number || data.code;
    if (data.edition_total) {

      return `#${padded} / ${data.edition_total}`;

  // ================= Unclaimed / invalid: simpler shared template =================
  function renderSimpleState(status, data, message, rawScanned) {
    headerRight.innerHTML = DEFAULT_HEADER_RIGHT;
    const unclaimed = status === 'unclaimed';
    const genesis = isGenesisCollection(data.collection_name);
    const accent = unclaimed ? (genesis ? 'var(--mint)' : 'var(--champagne-bright)') : 'var(--garnet)';
    const itemName = data.product_name || 'Valence Item';
    const editionBadge = editionBadgeFor(data);

    const title = unclaimed ? 'UNCONFIRMED' : 'NOT VERIFIED';
    const sub = unclaimed ? 'AWAITING CUSTOMER CONFIRMATION' : 'NO REGISTRY MATCH';

    let html = `
      <div class="simple-hero">
        <div class="simple-ring-wrap">${simpleRingSvg(unclaimed ? 'unclaimed' : 'invalid')}</div>
        <div class="simple-title" style="color:${accent};">${title}</div>
        <div class="simple-sub">${sub}</div>
    `;

    if (unclaimed) {
      html += `<p class="unclaimed-message">This item hasn't been confirmed yet. Enter the retailer's one-time code to confirm this is an original VALENCE product.</p>`;
      html += `<a class="claim-btn" href="claim.html?code=${encodeURIComponent(data.code)}">CONFIRM PRODUCT FOR AUTHENTICITY</a>`;
    } else {
      html += `<p class="invalid-message">${escapeHtml(message || 'This code could not be verified.')}</p>`;
    }
    html += `</div>`;

    if (unclaimed) {
      html += `<div class="section-gap">${productCardMarkup(data, itemName, data.edition_name, editionBadge, false)}</div>`;
      html += `
        <div class="section-gap">
          <div class="panel-box">
            <div class="panel-box-header">${icons.package}<span>PRODUCT DETAILS</span></div>
            <div class="detail-row">${icons.tag}<div class="detail-row-body"><span class="detail-label">Product</span><span class="detail-value">${escapeHtml(itemName)}</span></div></div>
            <div class="detail-row">${icons.layers}<div class="detail-row-body"><span class="detail-label">Collection</span><span class="detail-value">${escapeHtml(data.collection_name || '—')}</span></div></div>
            <div class="detail-row">${icons.ribbon}<div class="detail-row-body"><span class="detail-label">Edition</span><span class="detail-value">${escapeHtml(editionBadge ? editionBadge.replace('#', '').replace(' / ', ' of ') : '—')}</span></div></div>
            <div class="detail-row">${icons.calendar}<div class="detail-row-body"><span class="detail-label">Manufactured On</span><span class="detail-value">${escapeHtml(formatDate(data.manufactured_at))}</span></div></div>
          </div>
        </div>
      `;
    }

    if (!unclaimed && rawScanned) {
      const codeVal = data.code || '';
      const charCodes = Array.from(codeVal).map(ch => ch.charCodeAt(0).toString(16).padStart(4, '0')).join(' ');
      html += `
        <div class="debug-block">
          <div class="dt">DEBUG — RAW SCANNED TEXT</div>
          <div class="dv">${escapeHtml(rawScanned)}</div>
          <div class="dt">EXTRACTED CODE CHAR CODES (hex)</div>
          <div class="dv">${escapeHtml(charCodes)}</div>
        </div>
      `;
    }

    html += `
      <div class="action-row">
        <button class="scan-again" id="scan-again-btn">${icons.scan}SCAN ANOTHER</button>
        <a class="dash-link" href="dashboard.html">DASHBOARD</a>
      </div>
    `;
    return html;
  }

  function renderResult(status, data, message, rawScanned) {
    showStage(resultStage);

    let html;
    if (status === 'valid' && isGenesisCollection(data.collection_name)) {
      html = data._isOwnerViewing ? renderValidGenesis(data) : renderValidGenesisPublic(data);
    } else if (status === 'valid') {
      html = data._isOwnerViewing ? renderValidOwnerNonGenesis(data) : renderValidNonGenesis(data);
    } else {
      html = renderSimpleState(status, data, message, rawScanned);
    }

    resultStage.innerHTML = html;
    document.getElementById('scan-again-btn').addEventListener('click', startScan);
  }

  // --- Entry point ---
  // If the QR encoded a link with ?code=, or verify-authenticity.html
  // forwarded one, skip straight to the lookup. Otherwise open the camera
  // immediately — no extra tap required.
  const params = new URLSearchParams(window.location.search);
  const codeFromUrl = params.get('code');
  if (codeFromUrl) {
    verifyCode(normalizeCode(codeFromUrl), codeFromUrl);
  } else {
    startScan();
  }
</script>
