<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --black:#050608; --navy-900:#0b1220;
    --champagne:#cbb98d; --champagne-bright:#e8dcb8; --bronze:#8a7355;
    --gold:var(--champagne); --gold-bright:var(--champagne-bright);
    --platinum:#d7dade; --platinum-dim:#9aa1a8; --platinum-glow:rgba(215,218,222,0.14);
    --garnet:#b9847a; --garnet-dim:#8c6058; --garnet-glow:rgba(185,132,122,0.14);
    --panel:rgba(255,255,255,0.025); --panel-solid:#0b0d12;
    --border:rgba(255,255,255,0.08); --hairline:rgba(203,185,141,0.18);
    --text:#f3f1ea; --text-dim:#8b93a1; --text-dimmer:#565f6d;
    --mono:'JetBrains Mono',monospace; --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --serif:'Cormorant Garamond',Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{ margin:0; background:var(--black); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }

  header{
    display:flex; align-items:center; justify-content:space-between; padding:16px 22px;
    border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--navy-900),var(--black));
    position:sticky; top:0; z-index:20;
  }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .logo-chip img{ display:block; height:26px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .brand-word{ font-weight:800; letter-spacing:0.16em; color:var(--gold-bright); font-size:13px; }
  .back-link{ font-size:12px; font-family:var(--mono); color:var(--text-dim); }
  .back-link:hover{ color:var(--gold-bright); }

  main{ max-width:480px; margin:0 auto; padding:0 0 60px; min-height:calc(100vh - 63px); }

  /* ---------------- Camera / scanning stage ---------------- */
  #scan-stage{ padding:26px 20px 0; }
  #scan-stage.hidden{ display:none; }
  .scan-heading{ text-align:center; margin-bottom:18px; }
  .scan-heading h1{ font-size:18px; font-weight:700; margin:0 0 6px; }
  .scan-heading p{ font-size:13px; line-height:1.6; color:var(--text-dim); margin:0; }

  #cam-frame{
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--border);
    background:#000; aspect-ratio:1/1;
  }
  #qr-reader{ width:100%; height:100%; }
  #qr-reader video{ width:100% !important; height:100% !important; object-fit:cover; }
  /* html5-qrcode injects its own controls; keep them unobtrusive */
  #qr-reader__dashboard_section_csr button{
    font-family:var(--sans); font-size:12px; font-weight:600; color:var(--black);
    background:var(--gold-bright); border:none; border-radius:8px; padding:8px 14px; cursor:pointer;
  }
  #qr-reader__status_span{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }

  .scan-frame-overlay{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .scan-brackets{ position:relative; width:68%; aspect-ratio:1/1; }
  .scan-brackets span{ position:absolute; width:26px; height:26px; border:2.5px solid var(--gold-bright); }
  .scan-brackets span:nth-child(1){ top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .scan-brackets span:nth-child(2){ top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .scan-brackets span:nth-child(3){ bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .scan-brackets span:nth-child(4){ bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  .scan-line{
    position:absolute; left:6%; right:6%; height:2px; top:0;
    background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    box-shadow:0 0 10px 1px rgba(230,217,176,0.7);
    animation:sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep{
    0%,100%{ top:6%; opacity:0; }
    10%{ opacity:1; }
    50%{ top:94%; opacity:1; }
    60%{ opacity:0; }
  }

  .scan-footer{ padding:16px 4px 0; text-align:center; }
  .cancel-scan{
    font-family:var(--mono); font-size:12px; color:var(--text-dim); background:none;
    border:1px solid var(--border); border-radius:999px; padding:9px 20px; cursor:pointer;
  }
  .cancel-scan:hover{ color:var(--gold-bright); border-color:var(--gold); }
  .scan-note{ margin-top:14px; font-size:11.5px; color:var(--text-dimmer); font-family:var(--mono); text-align:center; }

  /* ---------------- Looking-up stage ---------------- */
  #lookup-stage{ padding:110px 24px; text-align:center; }
  #lookup-stage.hidden{ display:none; }
  .spinner{
    width:34px; height:34px; margin:0 auto 20px; border-radius:50%;
    border:2.5px solid var(--border); border-top-color:var(--gold-bright);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #lookup-stage p{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); }

  /* ---------------- Result / reveal stage ---------------- */
  #result-stage{ padding:34px 20px 0; }
  #result-stage.hidden{ display:none; }

  .seal-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:26px; }
  .seal{ width:96px; height:96px; }
  .seal-ring{ transform-origin:52px 52px; }
  .seal.valid .seal-ring{ animation:ring-in 0.8s cubic-bezier(.2,.8,.2,1) both; filter:drop-shadow(0 0 7px var(--platinum-glow)); }
  .seal.valid .seal-check{
    stroke-dasharray:34; stroke-dashoffset:34;
    animation:check-in 0.4s 0.6s ease-out forwards;
  }
  .seal.invalid .seal-ring{ filter:drop-shadow(0 0 7px var(--garnet-glow)); }
  .seal.invalid .seal-x{
    stroke-dasharray:24; stroke-dashoffset:24;
    animation:check-in 0.35s 0.4s ease-out forwards;
  }
  .seal.unclaimed .seal-ring{ animation:ring-in 0.8s cubic-bezier(.2,.8,.2,1) both; filter:drop-shadow(0 0 7px rgba(203,185,141,0.22)); }
  .seal.unclaimed .seal-dot{
    stroke-dasharray:20; stroke-dashoffset:20;
    animation:check-in 0.35s 0.5s ease-out forwards;
  }
  @keyframes ring-in{ from{ opacity:0; transform:scale(0.7); } to{ opacity:1; transform:scale(1); } }
  @keyframes check-in{ to{ stroke-dashoffset:0; } }

  .verdict{
    font-family:var(--serif); font-style:italic; font-weight:600;
    font-size:23px; letter-spacing:0.01em; margin-top:16px;
  }
  .verdict.valid{ color:var(--platinum); }
  .verdict.invalid{ color:var(--garnet); }
  .verdict.unclaimed{ color:var(--champagne-bright); }
  .verdict-sub{
    font-family:var(--mono); font-size:10px; color:var(--text-dimmer);
    margin-top:8px; letter-spacing:0.22em; font-weight:500;
  }

  .item-name{
    text-align:center; font-family:var(--serif); font-weight:600; font-size:30px;
    margin:24px 0 12px; line-height:1.25; letter-spacing:0.005em;
  }
  .edition-pill{
    display:block; width:fit-content; margin:0 auto 32px; font-family:var(--mono); font-size:10.5px;
    letter-spacing:0.1em; color:var(--champagne-bright); background:transparent;
    border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); padding:7px 0;
  }

  .unclaimed-message{
    text-align:center; font-size:13px; line-height:1.65; color:var(--text-dim); margin:0 0 26px; padding:0 8px;
  }
  .claim-btn{
    display:block; text-align:center; font-size:12.5px; font-weight:600; letter-spacing:0.09em; color:var(--black);
    background:var(--champagne-bright); border:none; border-radius:999px; padding:14px; cursor:pointer; font-family:var(--sans);
    margin-top:6px; text-transform:uppercase;
  }
  .claim-btn:hover{ background:var(--champagne); }

  /* Specs list — a passport-style data page: no boxed card, just a
     hairline top/bottom frame and quiet dividers between rows. */
  .specs{ border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); margin-bottom:18px; }
  .specs-label{
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em; color:var(--text-dimmer);
    padding:16px 2px 4px; font-weight:500;
  }
  .spec-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:14px;
    padding:13px 2px; border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .spec-row:last-child{ border-bottom:none; padding-bottom:17px; }
  .spec-row span:first-child{
    color:var(--text-dimmer); font-family:var(--mono); font-size:10px; letter-spacing:0.1em; font-weight:500;
  }
  .spec-row span:last-child{ color:var(--text); text-align:right; font-family:var(--serif); font-size:16px; font-weight:600; }

  /* Security hash strip — the signature element: a faint holographic
     shimmer sweeps across it, echoing a foil authentication sticker. */
  /* Security token — styled as an etched plate rather than a plain box:
     a faint brushed-metal texture, double hairline top/bottom like a
     plaque, and an engraved text treatment on the value itself. */
  .hash-strip{
    position:relative; margin:24px 0 4px; padding:16px 4px; overflow:hidden;
    border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline);
    text-align:center;
  }
  .hash-strip::before{
    content:''; position:absolute; inset:0; opacity:0.5;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  }
  .hash-strip::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(203,185,141,0.1) 48%, rgba(255,255,255,0.05) 50%, rgba(203,185,141,0.1) 52%, transparent 70%);
    background-size:260% 100%; animation:shimmer 4.5s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{ background-position:130% 0; } 100%{ background-position:-30% 0; } }
  .hash-label{
    position:relative; font-family:var(--mono); font-size:9px; letter-spacing:0.2em;
    color:var(--text-dimmer); margin-bottom:8px; font-weight:500;
  }
  .hash-value{
    position:relative; font-family:var(--mono); font-size:14px; letter-spacing:0.14em;
    color:var(--champagne-bright); word-break:break-all; font-weight:600;
    text-shadow:0 1px 0 rgba(0,0,0,0.65), 0 -1px 0 rgba(255,255,255,0.06);
  }

  .invalid-message{
    text-align:center; font-size:13px; line-height:1.6; color:var(--text-dim); margin:0 0 22px; padding:0 6px;
  }

  .action-row{ display:flex; gap:10px; margin-top:30px; }
  .scan-again, .dash-link{
    flex:1; text-align:center; font-size:12px; font-weight:600; font-family:var(--sans);
    letter-spacing:0.1em; text-transform:uppercase; border-radius:999px; padding:13px; cursor:pointer;
  }
  .scan-again{ color:var(--black); background:var(--champagne-bright); border:1px solid var(--champagne-bright); }
  .scan-again:hover{ background:var(--champagne); border-color:var(--champagne); }
  .dash-link{ color:var(--text-dim); background:transparent; border:1px solid var(--border); }
  .dash-link:hover{ border-color:var(--bronze); color:var(--champagne-bright); }

  .debug-block{ margin-top:16px; padding:12px; border:1px dashed var(--border); border-radius:10px; }
  .debug-block .dt{ font-family:var(--mono); font-size:10.5px; color:var(--text-dimmer); margin-bottom:6px; }
  .debug-block .dv{ font-family:var(--mono); font-size:11px; color:var(--text); word-break:break-all; margin-bottom:8px; }
</style>
</head>
<body>

<header>
  <div class="brandmark">
    <div class="logo-chip"><img src="valence-logo.png" alt="VALENCE"></div>
    <span class="brand-word">VALENCE</span>
  </div>
  <a class="back-link" href="verify-authenticity.html">&larr; BACK</a>
</header>

<main>

  <!-- Stage 1: camera opens immediately -->
  <div id="scan-stage">
    <div class="scan-heading">
      <h1>Scan Your Tag</h1>
      <p>Line up the QR code stitched or printed into your garment.</p>
    </div>
    <div id="cam-frame">
      <div id="qr-reader"></div>
      <div class="scan-frame-overlay">
        <div class="scan-brackets">
          <span></span><span></span><span></span><span></span>
          <div class="scan-line"></div>
        </div>
      </div>
    </div>
    <div class="scan-footer">
      <button class="cancel-scan" id="cancel-scan">CANCEL</button>
    </div>
    <div class="scan-note" id="scan-note"></div>
  </div>

  <!-- Stage 2: looking up the code -->
  <div id="lookup-stage" class="hidden">
    <div class="spinner"></div>
    <p>VERIFYING TAG…</p>
  </div>

  <!-- Stage 3: the reveal -->
  <div id="result-stage" class="hidden"></div>

</main>

<script>
  const scanStage = document.getElementById('scan-stage');
  const lookupStage = document.getElementById('lookup-stage');
  const resultStage = document.getElementById('result-stage');
  const scanNote = document.getElementById('scan-note');
  const cancelBtn = document.getElementById('cancel-scan');

  let html5QrCode = null;
  let isScanning = false;

  function showStage(stage) {
    [scanStage, lookupStage, resultStage].forEach(s => s.classList.add('hidden'));
    stage.classList.remove('hidden');
  }

  async function startScan() {
    scanNote.textContent = '';
    showStage(scanStage);
    try {
      if (typeof Html5Qrcode === 'undefined') {
        throw new Error('Html5Qrcode library failed to load (check network/CDN access).');
      }
      html5QrCode = new Html5Qrcode('qr-reader');
      await html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: (vw, vh) => {
            const edge = Math.floor(Math.min(vw, vh) * 0.72);
            return { width: edge, height: edge };
          }
        },
        onScanSuccess,
        () => { /* per-frame decode failures are expected while aiming — ignore */ }
      );
      isScanning = true;
    } catch (err) {
      scanNote.textContent = 'Camera unavailable — check permissions and try again.';
      console.error('Unable to start QR scanner', err);
    }
  }

  async function stopScan() {
    if (html5QrCode && isScanning) {
      try {
        await html5QrCode.stop();
        html5QrCode.clear();
      } catch (err) {
        console.error('Error stopping scanner', err);
      }
    }
    isScanning = false;
  }

  async function onScanSuccess(decodedText) {
    await stopScan();
    verifyCode(extractCode(decodedText), decodedText);
  }

  cancelBtn.addEventListener('click', async () => {
    await stopScan();
    window.location.href = 'verify-authenticity.html';
  });

  // A scanned QR may encode either a bare code ("VLC-001") or a full link
  // back to this page ("https://valencehq.vercel.app/product.html?code=VLC-001").
  function extractCode(raw) {
    const trimmed = (raw || '').trim();
    let extracted = trimmed;
    try {
      const url = new URL(trimmed);
      const fromParam = url.searchParams.get('code');
      if (fromParam) extracted = fromParam;
    } catch (e) {
      // not a URL — treat raw text as the code itself
    }
    return normalizeCode(extracted);
  }

  // Fixes common lookalike-character issues from copy/paste or autocorrect:
  // en dash / em dash / minus sign -> hyphen, zero-width chars removed.
  function normalizeCode(str) {
    return (str || '')
      .replace(/[\u2010-\u2015\u2212]/g, '-')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .trim()
      .toUpperCase();
  }

  function formatDate(value) {
    if (!value) return '—';
    const d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Look up the scanned code in Supabase and render the reveal ---
  // NOTE: adjust table/column names to match your schema. Expected columns
  // on `products`: qr_code, product_name, batch_number, manufactured_at,
  // item_number, edition_name, edition_total, owner_name, registered_at,
  // security_hash.
  async function verifyCode(code, rawScanned) {
    showStage(lookupStage);

    if (typeof supabaseClient === 'undefined') {
      renderResult(false, { code }, 'Verification service is not configured.', rawScanned);
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .eq('qr_code', code)
        .maybeSingle();

      if (error) throw error;

      if (data) {
        const status = data.owner_name ? 'valid' : 'unclaimed';
        renderResult(status, { code, ...data }, null, rawScanned);
      } else {
        renderResult('invalid', { code }, 'This code does not match any known Valence product.', rawScanned);
      }
    } catch (err) {
      console.error('Verification lookup failed', err);
      renderResult(false, { code }, 'Could not reach the verification service. Please try again.', rawScanned);
    }
  }

  function renderResult(status, data, message, rawScanned) {
    showStage(resultStage);

    const valid = status === 'valid';
    const unclaimed = status === 'unclaimed';

    const itemName = data.product_name || 'Valence Item';
    const editionName = data.edition_name;
    const editionTotal = data.edition_total;
    const itemNumber = data.item_number || data.code;
    const editionText = editionName
      ? `${editionName}${editionTotal ? ` · ${itemNumber} of ${editionTotal}` : ''}`
      : (data.batch_number ? `Batch ${data.batch_number}` : null);

    const sealSvg = valid ? sealValidSvg() : (unclaimed ? sealUnclaimedSvg() : sealInvalidSvg());
    const verdictClass = valid ? 'valid' : (unclaimed ? 'unclaimed' : 'invalid');
    const verdictText = valid
      ? 'Authentic Product — Verified'
      : (unclaimed ? 'Confirm Product For Authenticity' : 'Not Verified');
    const verdictSub = valid
      ? 'MATCHED AGAINST VALENCE REGISTRY'
      : (unclaimed ? 'GENUINE ITEM · NOT YET CONFIRMED' : 'NO REGISTRY MATCH');

    let html = `
      <div class="seal-wrap">
        ${sealSvg}
        <div class="verdict ${verdictClass}">${verdictText}</div>
        <div class="verdict-sub">${verdictSub}</div>
      </div>
    `;

    if (valid || unclaimed) {
      html += `<div class="item-name">${escapeHtml(itemName)}</div>`;
      if (editionText) html += `<div class="edition-pill">${escapeHtml(editionText)}</div>`;
    }

    if (valid) {
      html += `
        <div class="specs">
          <div class="specs-label">REGISTRATION</div>
          <div class="spec-row"><span>REGISTERED OWNER</span><span>${escapeHtml(data.owner_name || '—')}</span></div>
          <div class="spec-row"><span>REGISTERED ON</span><span>${escapeHtml(formatDate(data.registered_at))}</span></div>
          <div class="spec-row"><span>ITEM NUMBER</span><span>${escapeHtml(String(itemNumber || '—'))}</span></div>
          <div class="spec-row"><span>MANUFACTURED</span><span>${escapeHtml(formatDate(data.manufactured_at))}</span></div>
        </div>
      `;

      if (data.security_hash) {
        html += `
          <div class="hash-strip">
            <div class="hash-label">SECURITY TOKEN</div>
            <div class="hash-value">${escapeHtml(data.security_hash)}</div>
          </div>
        `;
      }
    } else if (unclaimed) {
      html += `
        <p class="unclaimed-message">
          This item hasn't been confirmed yet. Enter the retailer's one-time
          code to confirm this is an original VALENCE product.
        </p>
        <div class="specs">
          <div class="specs-label">PRODUCT</div>
          <div class="spec-row"><span>ITEM NUMBER</span><span>${escapeHtml(String(itemNumber || '—'))}</span></div>
          <div class="spec-row"><span>MANUFACTURED</span><span>${escapeHtml(formatDate(data.manufactured_at))}</span></div>
        </div>
        <a class="claim-btn" href="claim.html?code=${encodeURIComponent(data.code)}">CONFIRM PRODUCT FOR AUTHENTICITY</a>
      `;

      if (data.security_hash) {
        html += `
          <div class="hash-strip">
            <div class="hash-label">SECURITY TOKEN</div>
            <div class="hash-value">${escapeHtml(data.security_hash)}</div>
          </div>
        `;
      }
    } else {
      html += `<p class="invalid-message">${escapeHtml(message || 'This code could not be verified.')}</p>`;

      if (rawScanned) {
        const codeVal = data.code || '';
        const charCodes = Array.from(codeVal).map(ch => ch.charCodeAt(0).toString(16).padStart(4, '0')).join(' ');
        html += `
          <div class="debug-block">
            <div class="dt">DEBUG — RAW SCANNED TEXT</div>
            <div class="dv">${escapeHtml(rawScanned)}</div>
            <div class="dt">EXTRACTED CODE CHAR CODES (hex)</div>
            <div class="dv">${escapeHtml(charCodes)}</div>
          </div>
        `;
      }
    }

    html += `
      <div class="action-row">
        <button class="scan-again" id="scan-again-btn">SCAN ANOTHER</button>
        <a class="dash-link" href="dashboard.html">DASHBOARD</a>
      </div>
    `;

    resultStage.innerHTML = html;
    document.getElementById('scan-again-btn').addEventListener('click', startScan);
  }

  function sealValidSvg() {
    return `
      <svg class="seal valid" viewBox="0 0 104 104" fill="none">
        <circle class="seal-ring" cx="52" cy="52" r="45" stroke="var(--platinum)" stroke-width="1.25" opacity="0.9"/>
        <circle cx="52" cy="52" r="38" fill="var(--platinum-glow)"/>
        <path class="seal-check" d="M36 53l11 11 21-23" stroke="var(--platinum)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
  }

  function sealUnclaimedSvg() {
    return `
      <svg class="seal unclaimed" viewBox="0 0 104 104" fill="none">
        <circle class="seal-ring" cx="52" cy="52" r="45" stroke="var(--champagne-bright)" stroke-width="1.25" opacity="0.9"/>
        <circle cx="52" cy="52" r="38" fill="rgba(203,185,141,0.09)"/>
        <path class="seal-dot" d="M52 35v21" stroke="var(--champagne-bright)" stroke-width="2.75" stroke-linecap="round"/>
        <circle cx="52" cy="65" r="1.8" fill="var(--champagne-bright)"/>
      </svg>
    `;
  }

  function sealInvalidSvg() {
    return `
      <svg class="seal invalid" viewBox="0 0 104 104" fill="none">
        <circle class="seal-ring" cx="52" cy="52" r="45" stroke="var(--garnet)" stroke-width="1.25" opacity="0.9"/>
        <circle cx="52" cy="52" r="38" fill="var(--garnet-glow)"/>
        <path class="seal-x" d="M42 42l20 20M62 42l-20 20" stroke="var(--garnet)" stroke-width="2.75" stroke-linecap="round"/>
      </svg>
    `;
  }

  // --- Entry point ---
  // If the QR encoded a link with ?code=, or verify-authenticity.html
  // forwarded one, skip straight to the lookup. Otherwise open the camera
  // immediately — no extra tap required.
  const params = new URLSearchParams(window.location.search);
  const codeFromUrl = params.get('code');
  if (codeFromUrl) {
    verifyCode(normalizeCode(codeFromUrl), codeFromUrl);
  } else {
    startScan();
  }
</script>
