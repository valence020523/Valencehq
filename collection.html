<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Collection — VALENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --black:#05070b; --navy-950:#080d16; --navy-900:#0b1220; --navy-800:#101a2c;
    --panel:rgba(255,255,255,0.035); --border:rgba(255,255,255,0.09);
    --gold:#cbb98d; --gold-bright:#e6d9b0; --green:#3ddc84;
    --text:#f2f1ec; --text-dim:#93a0b4; --text-dimmer:#5c6779;
    --mono:'JetBrains Mono',monospace; --sans:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--black); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }

  .app{ display:flex; min-height:100vh; }

  /* ---------- logo ---------- */
  .logo-chip{ display:inline-flex; align-items:center; line-height:0; }
  .logo-chip img{ display:block; height:34px; width:auto; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
  .logo-chip.sm img{ height:26px; }
  .logo-chip.lg img{ height:44px; }
  .brandmark{ display:flex; align-items:center; gap:10px; }
  .brand-word{ font-weight:800; letter-spacing:0.16em; color:var(--gold-bright); font-size:15px; text-shadow:0 0 14px rgba(203,185,141,0.35); }
  .brand-word.sm{ font-size:12px; letter-spacing:0.13em; }
  .brand-word.lg{ font-size:17px; }

  /* ---------- sidebar (desktop) ---------- */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--navy-950);
    border-right:1px solid var(--border); padding:26px 16px; display:flex; flex-direction:column;
  }
  .brand{ padding:0 10px 28px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  nav.primary-nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px;
    font-size:13.5px; font-weight:700; color:var(--text-dim); cursor:pointer; border:1px solid transparent;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; opacity:0.85; }
  .nav-item:hover{ background:var(--panel); color:var(--text); }
  .nav-item.active{ background:rgba(203,185,141,0.14); color:var(--gold-bright); border-color:rgba(203,185,141,0.28); }
  .nav-item.active svg{ opacity:1; }
  .sidebar-bottom{ margin-top:auto; padding-top:16px; }
  .logout-btn{
    font-size:11.5px; font-weight:700; color:var(--text-dim); background:none;
    border:1px solid var(--border); border-radius:999px; padding:8px 12px; cursor:pointer;
    font-family:var(--sans); width:100%;
  }
  .logout-btn:hover{ color:var(--text); border-color:var(--gold); }

  /* ---------- mobile header + slide-out nav ---------- */
  .mobile-header{ display:none; }
  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:25; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }

  /* ---------- main ---------- */
  main.dash{
    flex:1; min-width:0; padding:26px 34px 60px;
    background:
      radial-gradient(1100px 480px at 82% -10%, rgba(203,185,141,0.10), transparent 60%),
      linear-gradient(180deg, var(--navy-900), var(--black) 55%);
  }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:34px; }
  .profile-block{ display:flex; align-items:center; gap:10px; }
  a.profile-block:hover .name{ color:var(--gold-bright); }
  .profile-text{ text-align:right; line-height:1.3; }
  .profile-text .label{ font-size:10px; letter-spacing:0.12em; color:var(--text-dimmer); font-family:var(--mono); font-weight:700; }
  .profile-text .name{ font-size:13.5px; font-weight:700; }
  .avatar-wrap{ position:relative; }
  .avatar{
    width:34px; height:34px; border-radius:50%; background:linear-gradient(145deg,#3a4a63,#1b2534);
    background-size:cover; background-position:center;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    color:var(--text); border:1px solid var(--border);
  }
  .status-dot{
    width:9px; height:9px; border-radius:50%; background:var(--green); position:absolute;
    right:-1px; bottom:-1px; border:2px solid var(--navy-900);
  }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  h1.title{ font-size:clamp(22px,2.6vw,30px); font-weight:800; letter-spacing:0.01em; margin:0; }
  h1.title span{ color:var(--gold-bright); }
  .subtitle{ font-size:12.5px; color:var(--text-dim); font-family:var(--mono); margin-top:4px; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.12em; color:var(--text-dimmer); margin-bottom:8px; font-weight:700; }

  /* ---------- filter tabs ---------- */
  .filter-row{ display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
  .filter-tab{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.06em;
    color:var(--text-dim); background:var(--panel); border:1px solid var(--border);
    border-radius:999px; padding:8px 14px; cursor:pointer;
  }
  .filter-tab:hover{ color:var(--text); border-color:var(--gold); }
  .filter-tab.active{ background:rgba(203,185,141,0.14); color:var(--gold-bright); border-color:rgba(203,185,141,0.28); }

  /* ---------- collection grid ---------- */
  .collection-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .item-card{ padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .item-swatch{
    height:140px; position:relative; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(200deg,#1a2233,#0a0e16 60%); overflow:hidden;
  }
  .item-swatch img{ width:100%; height:100%; object-fit:cover; display:block; }
  .item-swatch svg{ width:30px; height:30px; color:var(--gold); opacity:0.7; }
  .item-badge{
    position:absolute; top:10px; right:10px; display:flex; align-items:center; gap:5px;
    font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:0.06em;
    padding:4px 8px; border-radius:999px; backdrop-filter:blur(6px);
  }
  .item-badge.verified{ background:rgba(61,220,132,0.16); color:var(--green); border:1px solid rgba(61,220,132,0.35); }
  .item-badge.pending{ background:rgba(203,185,141,0.14); color:var(--gold-bright); border:1px solid rgba(203,185,141,0.3); }
  .item-badge .dot{ width:5px; height:5px; border-radius:50%; background:currentColor; }
  .item-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; }
  .item-name{ font-size:14px; font-weight:700; }
  .item-meta{ font-size:11px; color:var(--text-dimmer); font-family:var(--mono); font-weight:600; display:flex; justify-content:space-between; gap:8px; }
  .item-actions{ display:flex; gap:8px; margin-top:8px; }
  .btn-outline{
    background:none; cursor:pointer; border:1px solid rgba(203,185,141,0.4); color:var(--gold-bright);
    border-radius:8px; padding:8px 12px; font-size:11.5px; font-weight:700; font-family:var(--sans); flex:1; text-align:center;
  }
  .btn-outline:hover{ background:rgba(203,185,141,0.1); border-color:var(--gold); }

  /* ---------- empty state ---------- */
  .empty-state{
    grid-column:1 / -1; text-align:center; padding:60px 20px; display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .empty-state svg{ width:40px; height:40px; color:var(--text-dimmer); }
  .empty-state h3{ font-size:15px; font-weight:700; margin:0; }
  .empty-state p{ font-size:12.5px; color:var(--text-dim); margin:0; max-width:340px; }
  .empty-state a.btn-outline{ display:inline-block; margin-top:6px; padding:10px 20px; flex:none; }

  @media (max-width:980px){
    .sidebar{ display:none; }
    .mobile-header{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,var(--navy-900),var(--black));
      position:sticky; top:0; z-index:20;
    }
    .mobile-header .left{ display:flex; align-items:center; gap:12px; }
    .menu-btn{
      background:none; border:1px solid var(--border); border-radius:8px; width:32px; height:32px;
      display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); flex-shrink:0;
    }
    .menu-btn svg{ width:16px; height:16px; }
    .sidebar.mobile-open{
      display:flex; position:fixed; top:0; left:0; height:100%; z-index:30;
      transform:translateX(0); box-shadow:20px 0 40px rgba(0,0,0,0.5);
    }
    main.dash{ padding:18px 16px 44px; }
    .topbar{ display:none; }
    h1.title{ font-size:19px; }
    .collection-grid{ grid-template-columns:1fr 1fr; gap:12px; }
    .item-swatch{ height:110px; }
  }
  @media (max-width:560px){
    .collection-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="loading" style="color:var(--text-dim); font-size:14px; padding:60px 34px;">Loading your account…</div>

<div id="content" style="display:none;">

  <div class="scrim" id="scrim"></div>

  <header class="mobile-header">
    <div class="left">
      <button class="menu-btn" id="menu-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brandmark">
        <div class="logo-chip sm"><img src="valence-mark.png" alt="VALENCE"></div>
        <span class="brand-word sm">VALENCE</span>
      </div>
    </div>
    <a class="profile-block" href="profile.html">
      <div class="profile-text">
        <div class="label">PROFILE</div>
        <div class="name" id="dash-username-m">—</div>
      </div>
      <div class="avatar-wrap">
        <div class="avatar" id="avatar-initial-m">—</div>
        <div class="status-dot"></div>
      </div>
    </a>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brandmark">
          <div class="logo-chip lg"><img src="valence-logo.png" alt="VALENCE"></div>
          <span class="brand-word lg">VALENCE</span>
        </div>
      </div>
      <nav class="primary-nav">
        <a class="nav-item" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Dashboard</a>
        <a class="nav-item" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>My Profile</a>
        <a class="nav-item active" href="collection.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="1.5"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>My Products</a>
        <a class="nav-item" href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-1.5 12.5a2 2 0 01-2 1.5H7.5a2 2 0 01-2-1.5L4 5z"/><path d="M4 5l-1-2"/></svg>Orders</a>
        <a class="nav-item" href="events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Events &amp; Shows</a>
        <a class="nav-item" href="rewards.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="6"/><path d="M9 14l-2 7 5-3 5 3-2-7"/></svg>Rewards</a>
        <a class="nav-item" href="voting.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11v9M7 11L3 9.5V20l4 1M7 11l6-4 4 2.5M17 9.5V20l4-1V10l-4-2M11 7v10"/></svg>Voting</a>
        <a class="nav-item" href="invitations.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>Invitations</a>
        <a class="nav-item" href="support.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.7-2.5 1.7-2.5 3.5"/><path d="M12 17h.01"/></svg>Support</a>
        <a class="nav-item" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <button class="logout-btn" id="logout-btn">Log Out</button>
      </div>
    </aside>

    <main class="dash">
      <div class="topbar">
        <div class="brandmark">
          <div class="logo-chip"><img src="valence-logo.png" alt="VALENCE"></div>
          <span class="brand-word">VALENCE</span>
        </div>
        <a class="profile-block" href="profile.html">
          <div class="profile-text">
            <div class="label">PROFILE</div>
            <div class="name" id="dash-username">—</div>
          </div>
          <div class="avatar-wrap">
            <div class="avatar" id="avatar-initial">—</div>
            <div class="status-dot"></div>
          </div>
        </a>
      </div>

      <div class="page-head">
        <div>
          <h1 class="title">MY <span>COLLECTION</span></h1>
          <div class="subtitle" id="item-count">Loading items…</div>
        </div>
      </div>

      <div class="filter-row">
        <button class="filter-tab active" data-filter="all">ALL ITEMS</button>
        <button class="filter-tab" data-filter="verified">VERIFIED</button>
        <button class="filter-tab" data-filter="pending">PENDING VERIFICATION</button>
      </div>

      <div class="collection-grid" id="collection-grid">
        <!-- items injected here -->
      </div>
    </main>
  </div>
</div>

<script>
  const itemIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="1.5"/><path d="M8 7V5a4 4 0 018 0v2"/></svg>`;
  const emptyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="1.5"/><path d="M8 7V5a4 4 0 018 0v2"/><path d="M3 12h18"/></svg>`;

  function itemCardHTML(item){
    const verified = item.status === 'verified';
    const badge = verified
      ? `<div class="item-badge verified"><span class="dot"></span>VERIFIED</div>`
      : `<div class="item-badge pending"><span class="dot"></span>PENDING</div>`;
    const swatch = item.image_url
      ? `<img src="${item.image_url}" alt="${item.name}">`
      : itemIcon;
    const acquired = item.acquired_at
      ? new Date(item.acquired_at).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' })
      : '—';

    return `
      <div class="card item-card" data-status="${item.status}">
        <div class="item-swatch">${swatch}${badge}</div>
        <div class="item-body">
          <div class="item-name">${item.name}</div>
          <div class="item-meta"><span>SERIAL</span><span>${item.serial_number || '—'}</span></div>
          <div class="item-meta"><span>ACQUIRED</span><span>${acquired}</span></div>
          <div class="item-actions">
            <a class="btn-outline" href="verify-authenticity.html${item.serial_number ? '?serial=' + encodeURIComponent(item.serial_number) : ''}">Verify</a>
            <a class="btn-outline" href="market.html">View in Market</a>
          </div>
        </div>
      </div>`;
  }

  function emptyStateHTML(){
    return `
      <div class="empty-state">
        ${emptyIcon}
        <h3>No items yet</h3>
        <p>Items you purchase, pre-order, or receive at events will appear here once they're registered to your account.</p>
        <a class="btn-outline" href="market.html">Explore Market</a>
      </div>`;
  }

  let allItems = [];

  function renderItems(filter){
    const grid = document.getElementById('collection-grid');
    const filtered = filter === 'all' ? allItems : allItems.filter(i => i.status === filter);
    grid.innerHTML = filtered.length
      ? filtered.map(itemCardHTML).join('')
      : emptyStateHTML();
  }

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderItems(tab.dataset.filter);
    });
  });

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = 'index.html';
      return;
    }

    const user = session.user;
    const meta = user.user_metadata || {};
    const displayName = meta.username || (user.email ? user.email.split('@')[0] : 'Member');

    document.getElementById('dash-username').textContent = displayName;
    document.getElementById('dash-username-m').textContent = displayName;

    const avatarEls = [document.getElementById('avatar-initial'), document.getElementById('avatar-initial-m')];
    if (meta.avatar_url) {
      avatarEls.forEach(el => { el.style.backgroundImage = `url("${meta.avatar_url}")`; el.textContent = ''; });
    } else {
      const initial = displayName.charAt(0).toUpperCase();
      avatarEls.forEach(el => { el.textContent = initial; });
    }

    // Collection items — reads from a `collection_items` table keyed by user_id.
    // Expected columns: id, user_id, name, serial_number, status ('verified' | 'pending'),
    // image_url, acquired_at. Adjust the table/column names to match your schema.
    const countEl = document.getElementById('item-count');
    try {
      const { data: items, error } = await supabaseClient
        .from('collection_items')
        .select('*')
        .eq('user_id', user.id)
        .order('acquired_at', { ascending: false });

      if (error) throw error;

      allItems = items || [];
      countEl.textContent = `${allItems.length} item${allItems.length === 1 ? '' : 's'} in your collection`;
      renderItems('all');
    } catch (err) {
      console.error('Failed to load collection:', err);
      allItems = [];
      countEl.textContent = 'Unable to load items';
      renderItems('all');
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  })();

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) {
      window.location.href = 'index.html';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const menuBtn = document.getElementById('menu-btn');
  function toggleMenu(open){
    sidebar.classList.toggle('mobile-open', open);
    scrim.classList.toggle('open', open);
  }
  menuBtn.addEventListener('click', () => toggleMenu(true));
  scrim.addEventListener('click', () => toggleMenu(false));
</script>
</body>
</html>
